<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Politique de sécurité : interdit TOUT chargement ou envoi réseau (aucune donnée ne peut quitter le poste) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Planificateur d'ateliers</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#1f2933;--muted:#5f6b7a;--line:#d6dce4;
  --accent:#2f6fb3;--accent-d:#22578f;--danger:#b83227;--ok:#2e7d4f;--warn:#a86a0a;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
header.top{background:#1f3a5f;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:1.2rem;margin:0;font-weight:650}
.badge-local{background:#2e7d4f;border-radius:999px;padding:3px 11px;font-size:.8rem;white-space:nowrap}
.spacer{flex:1}
#hdr-counts{font-size:.85rem;opacity:.9}
nav.tabs{display:flex;gap:3px;padding:8px 16px 0;background:#e6eaf0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{border:1px solid transparent;border-bottom:none;background:transparent;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:.95rem;color:var(--muted);font-family:inherit}
nav.tabs button:hover{color:var(--text);background:#f0f3f7}
nav.tabs button.active{background:var(--bg);border-color:var(--line);color:var(--text);font-weight:650;margin-bottom:-1px}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
h2{font-size:1.15rem;margin:0 0 10px}
h3{font-size:1rem;margin:16px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
small{color:var(--muted)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1;min-width:280px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.92rem;font-family:inherit;text-decoration:none}
.btn:hover{background:#f1f4f8}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d)}
.btn-big{font-size:1rem;padding:9px 18px;font-weight:650}
header .btn-primary{background:#f2b632;border-color:#f2b632;color:#1f2933}
header .btn-primary:hover{background:#e4a51c}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger-o{color:var(--danger);border-color:#e3b5b0}
.btn-danger-o:hover{background:#fbeeed}
.btn-sm{padding:3px 9px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-align:center}
.linkbtn:hover{text-decoration:underline}
label.chk{display:inline-flex;align-items:center;gap:5px;margin:3px 12px 3px 0;cursor:pointer}
.field{margin:8px 0}
.field>label{display:block;font-weight:600;font-size:.9rem;margin-bottom:3px}
input[type=text],input[type=number],input[type=time],input:not([type]),select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);max-width:100%}
input[type=number]{width:90px}
input[type=color]{width:46px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,select:focus,button:focus-visible,.session:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
table.data{border-collapse:collapse;width:100%;font-size:.92rem}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.data th{background:#f3f5f8;font-weight:650;font-size:.85rem}
table.data tr:hover td{background:#fafbfc}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;margin:1px 2px 1px 0;border:1px solid var(--c,#999);background:color-mix(in srgb,var(--c,#999) 14%,#fff);white-space:nowrap}
.tag{display:inline-block;padding:0 7px;border-radius:4px;font-size:.75rem;font-weight:650;margin-right:5px;background:#eef1f5;color:#384452;white-space:nowrap}
.tag.t-creneaux{background:#e8f0fb;color:#24538a}.tag.t-professionnel{background:#f3e8fb;color:#6a2c8f}.tag.t-salle{background:#fbf0e3;color:#8a5414}.tag.t-capacite{background:#fbe6e6;color:#962b2b}.tag.t-groupe{background:#e6f5ee;color:#24704a}.tag.t-donnees{background:#eceff3;color:#3d4753}
.status{font-weight:650;white-space:nowrap}
.st-complet{color:var(--ok)}.st-partiel{color:var(--warn)}.st-non{color:var(--danger)}
.alert{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:.92rem}
.alert-warn{background:#fff6e0;border:1px solid #f0d58a}
.alert-err{background:#fdecea;border:1px solid #f1b8b2}
.alert-ok{background:#e9f6ee;border:1px solid #b5dfc3}
.alert-info{background:#eaf2fb;border:1px solid #bcd3ee}
.alert ul{margin:4px 0 0 18px;padding:0}
table.grid{border-collapse:collapse;margin:6px 0}
table.grid th,table.grid td{border:1px solid var(--line);padding:4px 8px;text-align:center;font-size:.85rem}
table.grid th{background:#f3f5f8;font-weight:600}
table.grid td input{width:18px;height:18px;cursor:pointer}
.formbox{background:#f8fafc;border:1px dashed #c3ccd8;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.dropzone{border:2px dashed #9fb3cc;border-radius:10px;padding:22px;text-align:center;background:#f7fafd;cursor:pointer}
.dropzone.over{background:#e3eefb;border-color:var(--accent)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.stat{background:#f3f6fa;border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-width:120px}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.8rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Agenda */
.agenda-wrap{overflow-x:auto}
table.agenda{border-collapse:collapse;width:100%;table-layout:fixed;min-width:760px}
table.agenda th,table.agenda td{border:1px solid var(--line);vertical-align:top}
table.agenda thead th{background:#1f3a5f;color:#fff;padding:8px;font-size:.95rem}
table.agenda th.slot{background:#f3f5f8;color:var(--text);width:120px;padding:8px;text-align:left;font-size:.85rem}
table.agenda td.cell{padding:5px;background:#fff;position:relative;min-height:80px}
.cell-inner{display:flex;flex-direction:column;gap:5px;min-height:46px}
.session{border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);border-radius:6px;padding:5px 7px;font-size:.82rem;cursor:pointer;break-inside:avoid}
.session:hover{background:color-mix(in srgb,var(--c) 22%,#fff)}
.s-title{font-weight:700;font-size:.86rem}
.s-meta{color:#3d4753}
.s-count{font-size:.78rem;color:#3d4753}
.s-count.under{color:var(--danger);font-weight:650}
.s-parts{font-size:.78rem;color:#2c3540;margin-top:2px;word-break:break-word}
.add-s{display:block;width:100%;margin-top:4px;border:1px dashed #c9d2dd;background:transparent;color:#8794a3;border-radius:6px;cursor:pointer;font-size:.8rem;padding:2px}
.add-s:hover{background:#f1f5fa;color:var(--accent)}
.stale{background:#fff1d6;border:1px solid #f0c674}
/* Fenêtre modale */
dialog{border:none;border-radius:12px;padding:0;max-width:760px;width:94vw;box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,30,45,.45)}
#modal-body{padding:18px 22px;max-height:86vh;overflow:auto}
ul.parts{list-style:none;padding:0;margin:6px 0}
ul.parts li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid #eef1f4}
ul.parts li.bad{background:#fdecea}
.err-txt{color:var(--danger);font-size:.85rem}
.imp-file{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.imp-file h3{margin:0 0 4px}
.imp-list{max-height:220px;overflow:auto;margin:4px 0;padding-left:18px;font-size:.88rem}
#overlay{position:fixed;inset:0;background:rgba(20,30,45,.4);display:flex;align-items:center;justify-content:center;z-index:50}
#overlay[hidden]{display:none}
.ov-box{background:#fff;padding:20px 28px;border-radius:12px;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 18px;border-radius:8px;z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.err{background:var(--danger)}
#toast[hidden]{display:none}
details>summary{cursor:pointer;font-weight:600;margin:6px 0}
.print-only{display:none}
code{background:#eef1f5;padding:0 4px;border-radius:4px;font-size:.88em}
ol.steps li{margin:5px 0}
@media print{
  header.top,nav.tabs,.no-print,.add-s,#toast,#overlay{display:none!important}
  .print-only{display:block}
  body{background:#fff;font-size:11px}
  main{padding:0;max-width:none}
  .card{border:none;padding:0;margin:0 0 8px}
  table.agenda{min-width:0}
  table.agenda thead th{background:#ddd!important;color:#000!important}
  .session{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:8mm}
}
</style>

<body>
<header class="top no-print">
  <h1>🗓️ Planificateur d'ateliers</h1>
  <span class="badge-local" title="Ce fichier fonctionne hors ligne. Aucune donnée n'est envoyée sur Internet : le navigateur bloque tout appel réseau.">🔒 100 % local – aucune donnée ne quitte ce poste</span>
  <span class="spacer"></span>
  <span id="hdr-counts"></span>
  <button class="btn btn-primary btn-big" data-act="generate">⚙️ Générer l'agenda</button>
</header>
<nav class="tabs no-print" id="tabs"></nav>
<main id="main"></main>
<div id="overlay" hidden><div class="ov-box">⏳ Calcul de l'agenda en cours…</div></div>
<div id="toast" hidden></div>
<dialog id="modal"><div id="modal-body"></div></dialog>
<input type="file" id="file-input" multiple accept=".csv,.txt,text/csv" hidden>

<script>
'use strict';
/* =====================================================================
   PLANIFICATEUR D'ATELIERS — fichier unique, 100 % local
   Aucune bibliothèque externe, aucun appel réseau, aucun cookie.
   Stockage navigateur uniquement si l'utilisateur l'active (désactivé par défaut).
   ===================================================================== */

/* ---------- Constantes ---------- */
const DAYS=[['Lun','Lundi'],['Mar','Mardi'],['Mer','Mercredi'],['Jeu','Jeudi'],['Ven','Vendredi'],['Sam','Samedi'],['Dim','Dimanche']];
const DAY_LABEL=Object.fromEntries(DAYS);
const DAY_ORDER=DAYS.map(d=>d[0]);
const PALETTE=['#e07a5f','#3d9970','#4a7fc1','#c08a1e','#9b59b6','#16a3a3','#d35d8f','#6b8e23','#8d6e63','#5c6bc0','#ef8f00','#00897b'];
const PRIO={1:'Normale',2:'Haute',3:'Très haute'};
const STORE_KEY='planificateur-ateliers-v1';
const SEP_NAMES={';':'point-virgule',',':'virgule','\t':'tabulation'};
const TABS=[['accueil','Accueil'],['parametres','1. Paramètres'],['professionnels','2. Professionnels'],['salles','3. Salles'],['activites','4. Activités'],['personnes','5. Personnes'],['import','Import / Export CSV'],['agenda','📅 Agenda']];

/* ---------- État ---------- */
function defaultState(){
  return {
    settings:{openDays:['Lun','Mar','Mer','Jeu','Ven'],maxPerDay:2,defaultMin:2,iterations:60,csvSep:';',persist:false},
    slots:[
      {id:'M1',label:'Matin 1',start:'09:30',end:'10:45'},
      {id:'M2',label:'Matin 2',start:'11:00',end:'12:15'},
      {id:'A1',label:'Après-midi 1',start:'13:45',end:'15:00'},
      {id:'A2',label:'Après-midi 2',start:'15:15',end:'16:30'}],
    families:[
      {name:'Création',color:'#e07a5f'},{name:'Activités sportives',color:'#3d9970'},
      {name:'Habiletés sociales',color:'#4a7fc1'},{name:'Autonomie quotidienne',color:'#c08a1e'},
      {name:'Bien-être',color:'#9b59b6'},{name:'Cognition',color:'#16a3a3'}],
    pros:[],rooms:[],activities:[],persons:[],
    plan:null,planStale:false
  };
}
let S=defaultState();
let currentTab='accueil';
const editing={pros:null,rooms:null,activities:null,persons:null};
const UI={filter:'all',showParts:true,personSearch:''};
let draft=null;          // atelier en cours de modification
let pendingImport=null;  // import en attente de confirmation

/* ---------- Utilitaires ---------- */
const $=(sel,root=document)=>root.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const normHeader=s=>norm(s).replace(/[\s\-'’.]+/g,'_').replace(/^_+|_+$/g,'');
const sameKey=(a,b)=>norm(a)===norm(b);
const splitList=s=>String(s??'').split(/\s*[,|]\s*/).map(x=>x.trim()).filter(Boolean);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>'s'+Math.random().toString(36).slice(2,10);
const badChars=v=>/[;,|"]/.test(v);
const byCode=(a,b)=>String(a).localeCompare(String(b),'fr',{numeric:true});
function parseDay(s){const m={lun:'Lun',mar:'Mar',mer:'Mer',jeu:'Jeu',ven:'Ven',sam:'Sam',dim:'Dim'};return m[norm(s).slice(0,3)]||null;}
function sortDays(a){return [...new Set(a)].sort((x,y)=>DAY_ORDER.indexOf(x)-DAY_ORDER.indexOf(y));}
function normTime(t){const m=String(t??'').trim().match(/^(\d{1,2})\s*[:hH]\s*(\d{2})?$/);if(!m)return null;const h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');}
function intStrict(v){return /^\s*\d+\s*$/.test(String(v??''))?parseInt(v,10):NaN;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sortedSlots(st=S){return st.slots.slice().sort((a,b)=>a.start.localeCompare(b.start));}
function openDays(st=S){return sortDays(st.settings.openDays);}
function slotTxt(id,st=S){const s=st.slots.find(x=>x.id===id);return s?`${s.label||s.id} (${s.start}–${s.end})`:id;}
function famColor(name,st=S){const f=st.families.find(f=>f.name===name);return f?f.color:'#9aa5b1';}
function chip(name){return `<span class="chip" style="--c:${famColor(name)}">${esc(name)}</span>`;}
function effMin(a,st=S){return (a&&a.min!=null&&a.min!=='')?Number(a.min):st.settings.defaultMin;}
function proAvailable(st,code,ds){const p=st.pros.find(x=>x.code===code);if(!p)return false;const[d,s]=ds.split('|');return (p.avail[d]||[]).includes(s);}
function compatibleRooms(st,a){return st.rooms.filter(r=>r.capacity>0&&(!r.families.length||r.families.includes(a.family)));}
function sessCap(st,s){const a=st.activities.find(x=>x.name===s.activity),r=st.rooms.find(x=>x.name===s.room);return Math.min(a?a.capacity:99,r?r.capacity:99);}
let toastTimer=null;
function toast(msg,type){const t=$('#toast');t.textContent=msg;t.className=type==='err'?'err':'';t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,type==='err'?6000:3500);}

/* ---------- Persistance (option désactivée par défaut) ---------- */
function persist(){if(!S.settings.persist)return;try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}
function loadPersisted(){
  try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return false;
    const o=JSON.parse(raw);const d=defaultState();
    S=Object.assign(d,o);S.settings=Object.assign(defaultState().settings,o.settings||{});S.settings.persist=true;return true;
  }catch(e){return false;}
}
function setPersist(on){
  try{if(on){S.settings.persist=true;localStorage.setItem(STORE_KEY,JSON.stringify(S));}
      else{S.settings.persist=false;localStorage.removeItem(STORE_KEY);}}
  catch(e){S.settings.persist=false;toast("Ce navigateur refuse l'enregistrement local pour ce fichier : l'option reste désactivée.",'err');}
}
function changed(){if(S.plan)S.planStale=true;persist();}
function planChanged(){persist();}

/* ---------- Propagation des renommages / suppressions ---------- */
function renameFamily(o,n){S.activities.forEach(a=>{if(a.family===o)a.family=n;});S.rooms.forEach(r=>r.families=r.families.map(f=>f===o?n:f));S.persons.forEach(p=>p.needs=p.needs.map(f=>f===o?n:f));if(S.plan)S.plan.sessions.forEach(s=>{if(s.family===o)s.family=n;});}
function renamePro(o,n){S.activities.forEach(a=>a.pros=a.pros.map(c=>c===o?n:c));if(S.plan)S.plan.sessions.forEach(s=>{if(s.pro===o)s.pro=n;});}
function renameRoom(o,n){if(S.plan)S.plan.sessions.forEach(s=>{if(s.room===o)s.room=n;});}
function renameActivity(o,n){if(S.plan)S.plan.sessions.forEach(s=>{if(s.activity===o)s.activity=n;});}
function renamePerson(o,n){if(S.plan)S.plan.sessions.forEach(s=>s.participants=s.participants.map(c=>c===o?n:c));}
function renameSlot(o,n){const sl=S.slots.find(s=>s.id===o);if(sl)sl.id=n;S.pros.forEach(p=>{for(const d in p.avail)p.avail[d]=p.avail[d].map(x=>x===o?n:x);});S.persons.forEach(p=>p.unavail=(p.unavail||[]).map(u=>{const[d,s]=u.split('-');return s===o?d+'-'+n:u;}));if(S.plan)S.plan.sessions.forEach(s=>{if(s.slot===o)s.slot=n;});}
function sanitizePlan(st){
  if(!st.plan)return 0;
  const acts=new Set(st.activities.map(a=>a.name)),pros=new Set(st.pros.map(p=>p.code)),rooms=new Set(st.rooms.map(r=>r.name)),
        slots=new Set(st.slots.map(s=>s.id)),pers=new Set(st.persons.map(p=>p.code)),days=new Set(st.settings.openDays);
  const before=st.plan.sessions.length;
  st.plan.sessions=st.plan.sessions.filter(s=>acts.has(s.activity)&&pros.has(s.pro)&&rooms.has(s.room)&&slots.has(s.slot)&&days.has(s.day));
  st.plan.sessions.forEach(s=>{s.participants=s.participants.filter(c=>pers.has(c));s.family=st.activities.find(a=>a.name===s.activity).family;});
  return before-st.plan.sessions.length;
}
function cleanRefs(st,warns){
  const slotIds=new Set(st.slots.map(s=>s.id)),fams=new Set(st.families.map(f=>f.name)),pros=new Set(st.pros.map(p=>p.code));
  st.pros.forEach(p=>{for(const d in p.avail){p.avail[d]=p.avail[d].filter(s=>slotIds.has(s));if(!p.avail[d].length)delete p.avail[d];}});
  st.persons.forEach(p=>{
    p.unavail=(p.unavail||[]).filter(u=>slotIds.has(u.split('-')[1]));
    const bad=p.needs.filter(f=>!fams.has(f));
    if(bad.length){warns.push(`Personne ${p.code} : besoin(s) « ${bad.join(', ')} » retiré(s) car la famille n'existe plus.`);p.needs=p.needs.filter(f=>fams.has(f));}
  });
  st.rooms.forEach(r=>r.families=r.families.filter(f=>fams.has(f)));
  st.activities.forEach(a=>{
    if(!fams.has(a.family))warns.push(`Activité « ${a.name} » : la famille « ${a.family} » n'existe pas. L'activité sera ignorée tant qu'elle n'est pas corrigée.`);
    const bad=a.pros.filter(c=>!pros.has(c));
    if(bad.length){warns.push(`Activité « ${a.name} » : animateur(s) « ${bad.join(', ')} » retiré(s) car inconnu(s).`);a.pros=a.pros.filter(c=>pros.has(c));}
  });
  const n=sanitizePlan(st);
  if(n)warns.push(`${n} atelier(s) de l'agenda retiré(s) car ils faisaient référence à des données supprimées.`);
}

/* =====================================================================
   CSV : lecture, écriture, formats
   ===================================================================== */
function parseCSV(text,sep,startLine){
  const rows=[];let row=[],field='',inQ=false,line=startLine||1,rowLine=line,i=0;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}inQ=false;i++;continue;}
      if(c==='\n')line++;
      field+=c;i++;continue;
    }
    if(c==='"'&&field.trim()===''){field='';inQ=true;i++;continue;}
    if(c===sep){row.push(field);field='';i++;continue;}
    if(c==='\n'){row.push(field);rows.push({line:rowLine,cells:row});row=[];field='';line++;rowLine=line;i++;continue;}
    field+=c;i++;
  }
  if(field!==''||row.length){row.push(field);rows.push({line:rowLine,cells:row});}
  return rows.filter(r=>r.cells.some(x=>x.trim()!==''));
}
function detectSep(text){
  const first=text.split('\n',1)[0];let best=';',bc=0;
  for(const c of [';','\t',',']){let n=0,q=false;for(const ch of first){if(ch==='"')q=!q;else if(!q&&ch===c)n++;}if(n>bc){bc=n;best=c;}}
  return best;
}
function parseAny(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  let sep=null,start=1;const m=text.match(/^sep=(.)\n/i);
  if(m){sep=m[1];text=text.slice(m[0].length);start=2;}
  sep=sep||detectSep(text);
  return {sep,rows:parseCSV(text,sep,start)};
}
async function readFileText(file){
  const buf=file.arrayBuffer?await file.arrayBuffer():await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko(r.error);r.readAsArrayBuffer(file);});
  const bytes=new Uint8Array(buf);
  try{return {text:new TextDecoder('utf-8',{fatal:true}).decode(bytes),enc:'UTF-8'};}
  catch(e){return {text:new TextDecoder('windows-1252').decode(bytes),enc:'Windows-1252 (ANSI, converti automatiquement)'};}
}
function csvCell(v,sep){v=String(v??'');return (v.includes(sep)||/["\n\r]/.test(v)||/^\s|\s$/.test(v))?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows,sep){return '\uFEFF'+rows.map(r=>r.map(c=>csvCell(c,sep)).join(sep)).join('\r\n')+'\r\n';}
function exportSep(){return S.settings.csvSep==='tab'?'\t':S.settings.csvSep;}
function download(name,content,mime){
  const blob=new Blob([content],{type:mime||'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

const IMPORTERS={
  parametres(st,rows,mode,rep){

    for(let i=1;i<st.slots.length;i++)if(st.slots[i].start<st.slots[i-1].end)rep.warn(null,`Les créneaux ${st.slots[i-1].id} et ${st.slots[i].id} se chevauchent : vérifiez les horaires.`);

      if(seen.has(norm(name))){rep.err(L,`L'activité « ${name} » apparaît déjà ligne ${seen.get(norm(name))}.`);continue;}
      const fam=findFam(st,(r.famille||'').trim());
      if(!fam){rep.err(L,`Famille « ${r.famille||''} » inconnue. Familles existantes : ${st.families.map(f=>f.name).join(', ')}.`);continue;}
      const items=splitList(r.animateurs);
      if(!items.length){rep.err(L,'Aucun animateur indiqué : au moins un professionnel est nécessaire.');continue;}
      const ps=items.map(x=>findPro(st,x));const bad=items.filter((x,i)=>!ps[i]);
      if(bad.length){rep.err(L,`Animateur(s) « ${bad.join(', ')} » inconnu(s). Ajoutez-les d'abord dans les professionnels.`);continue;}
      let cap=8;if((r.capacite_max||'').trim()){cap=intStrict(r.capacite_max);if(!(cap>=1&&cap<=200)){rep.err(L,`Capacité « ${r.capacite_max} » invalide : nombre entier attendu.`);continue;}}
      let min=null;if((r.min_participants||'').trim()){min=intStrict(r.min_participants);if(!(min>=1&&min<=200)){rep.err(L,`Minimum de participants « ${r.min_participants} » invalide : nombre entier attendu.`);continue;}}
      if(min!=null&&min>cap){rep.err(L,`Le minimum de participants (${min}) dépasse la capacité (${cap}).`);continue;}
      let mx=0;if((r.max_seances_semaine||'').trim()){mx=intStrict(r.max_seances_semaine);if(!(mx>=0&&mx<=100)){rep.err(L,`Nombre de séances « ${r.max_seances_semaine} » invalide : nombre entier attendu.`);continue;}}
      seen.set(norm(name),L);
      upsert(st.activities,a=>a.name,{name,family:fam.name,pros:[...new Set(ps.map(p=>p.code))],capacity:cap,min,maxPerWeek:mx},name);rep.ok++;
    }
  },
  personnes(st,rows,mode,rep){
    if(mode==='replace')st.persons=[];const seen=new Map();
    for(const r of rows){const L=r._line,code=(r.code||'').trim();
      const pb=personCodeProblem(code);if(pb){rep.err(L,pb);continue;}
      if(seen.has(norm(code))){rep.err(L,`Le code « ${code} » est déjà utilisé ligne ${seen.get(norm(code))} : chaque personne doit avoir un code unique.`);continue;}
      const di=splitList(r.jours_presence);const ds=di.map(parseDay);const badD=di.filter((x,i)=>!ds[i]);
      if(!di.length){rep.err(L,'Aucun jour de présence indiqué.');continue;}
      if(badD.length){rep.err(L,`Jour(s) « ${badD.join(', ')} » non reconnu(s). Utilisez Lun, Mar, Mer, Jeu, Ven, Sam, Dim.`);continue;}
      const ni=splitList(r.besoins);const fs=ni.map(x=>findFam(st,x));const badF=ni.filter((x,i)=>!fs[i]);
      if(!ni.length){rep.err(L,'Aucun besoin (famille d\'activités) indiqué.');continue;}
      if(badF.length){rep.err(L,`Besoin(s) « ${badF.join(', ')} » inconnu(s). Familles existantes : ${st.families.map(f=>f.name).join(', ')}.`);continue;}
      const nb=intStrict(r.nb_ateliers);
      if(!(nb>=1&&nb<=30)){rep.err(L,`Nombre d'ateliers « ${r.nb_ateliers||''} » invalide : nombre entier entre 1 et 30 attendu.`);continue;}
      let pr=1;const pv=norm(r.priorite);
      if(pv){pr={'1':1,'2':2,'3':3,normale:1,haute:2,'tres haute':3,prioritaire:2}[pv];if(!pr){rep.err(L,`Priorité « ${r.priorite} » non reconnue : indiquez 1, 2 ou 3.`);continue;}}
      const ui=splitList(r.indisponibilites);const un=[];let bu=null;
      for(const u of ui){const parts=u.split(/\s*[-:\s]\s*/);const d=parseDay(parts[0]);const s=parts[1]&&findSlot(st,parts[1]);if(!d||!s){bu=u;break;}un.push(d+'-'+s.id);}
      if(bu){rep.err(L,`Indisponibilité « ${bu} » non comprise. Forme attendue : Jour-Créneau, par ex. Mar-M1.`);continue;}
      seen.set(norm(code),L);
      const days=sortDays(ds);
      const closed=days.filter(d=>!st.settings.openDays.includes(d));
      if(closed.length)rep.warn(L,`${code} : ${closed.map(d=>DAY_LABEL[d]).join(', ')} n'est pas un jour d'ouverture (ignoré pour la planification).`);
      const possible=days.filter(d=>st.settings.openDays.includes(d)).length*st.settings.maxPerDay;
      if(nb>possible)rep.warn(L,`${code} demande ${nb} atelier(s) mais ne peut en avoir que ${possible} au maximum (${st.settings.maxPerDay} par jour de présence).`);
      upsert(st.persons,p=>p.code,{code,days,needs:[...new Set(fs.map(f=>f.name))],nb,priority:pr,unavail:[...new Set(un)]},code);rep.ok++;
    }
  },
  agenda(st,rows,mode,rep){
    if(mode==='replace'||!st.plan)st.plan={sessions:[],generatedAt:'importé le '+new Date().toLocaleString('fr-FR')};
    for(const r of rows){const L=r._line;
      const d=parseDay(r.jour);if(!d){rep.err(L,`Jour « ${r.jour||''} » non reconnu.`);continue;}
      const sl=findSlot(st,(r.creneau||'').trim());if(!sl){rep.err(L,`Créneau « ${r.creneau||''} » inconnu.`);continue;}
      const a=st.activities.find(x=>sameKey(x.name,r.activite));if(!a){rep.err(L,`Activité « ${r.activite||''} » inconnue.`);continue;}
      const pro=findPro(st,(r.animateur||'').trim());if(!pro){rep.err(L,`Animateur « ${r.animateur||''} » inconnu.`);continue;}
      const room=st.rooms.find(x=>sameKey(x.name,r.salle));if(!room){rep.err(L,`Salle « ${r.salle||''} » inconnue.`);continue;}
      const items=splitList(r.participants);const ps=items.map(x=>findPerson(st,x));const bad=items.filter((x,i)=>!ps[i]);
      if(bad.length){rep.err(L,`Personne(s) « ${bad.join(', ')} » inconnue(s).`);continue;}
      const idx=planIndex(st,st.plan);const ds=d+'|'+sl.id;
      if(idx.busyPro.has(pro.code+'|'+ds)){rep.err(L,`${pro.code} anime déjà un autre atelier le ${DAY_LABEL[d]} (${sl.id}).`);continue;}
      if(idx.busyRoom.has(room.name+'|'+ds)){rep.err(L,`La salle « ${room.name} » est déjà occupée le ${DAY_LABEL[d]} (${sl.id}).`);continue;}
      const dbl=ps.filter(p=>idx.busyP.get(p.code)?.has(ds));
      if(dbl.length){rep.err(L,`${dbl.map(p=>p.code).join(', ')} : déjà affecté(e)(s) à un autre atelier sur ce créneau.`);continue;}
      if(!st.settings.openDays.includes(d))rep.warn(L,`Le ${DAY_LABEL[d]} n'est pas un jour d'ouverture : cet atelier ne sera pas affiché.`);
      if(ps.length>Math.min(a.capacity,room.capacity))rep.warn(L,`Capacité dépassée : ${ps.length} participants pour ${Math.min(a.capacity,room.capacity)} places.`);
      st.plan.sessions.push({id:uid(),activity:a.name,family:a.family,day:d,slot:sl.id,pro:pro.code,room:room.name,participants:[...new Set(ps.map(p=>p.code))].sort(byCode),locked:['oui','o','yes','1','x','vrai'].includes(norm(r.verrouille))});
      rep.ok++;
    }
  }
};

async function handleImportFiles(fileList){
  const files=[...fileList];if(!files.length)return;
  const modeEl=document.querySelector('input[name="imp-mode"]:checked');const mode=modeEl?modeEl.value:'replace';
  const st=clone(S);const parsed=[];
  for(const f of files){
    const rep=newRep(f.name);
    try{
      const {text,enc}=await readFileText(f);rep.enc=enc;
      const {sep,rows}=parseAny(text);rep.sep=SEP_NAMES[sep]||sep;
      if(!rows.length){rep.fatal='Le fichier est vide.';parsed.push({rep});continue;}
      const headers=rows[0].cells.map(h=>{const n=normHeader(h);return HEADER_ALIASES[n]||n;});
      const type=detectType(headers);
      if(!type){
        rep.fatal=(headers.includes('personne')&&headers.includes('activite'))
          ? "Ce fichier est un export « agenda par personne » : il sert à la lecture et ne peut pas être réimporté. Pour reprendre un agenda, importez le fichier agenda_ateliers.csv."
          : `Type de fichier non reconnu. La première ligne doit contenir les en-têtes d'un des formats documentés (par ex. pour les personnes : code;jours_presence;besoins;nb_ateliers). En-têtes trouvés : ${rows[0].cells.join(' | ')}`;
        parsed.push({rep});continue;
      }
      rep.type=type;
      const known=new Set(CSV_TYPES[type].cols.map(c=>c.k));
      const unknown=headers.filter(h=>h&&!known.has(h));
      if(unknown.length)rep.warn(1,`Colonne(s) non reconnue(s) et ignorée(s) : ${unknown.join(', ')}.`);
      const objs=rows.slice(1).map(r=>{const o={_line:r.line};headers.forEach((h,i)=>{if(h&&!(h in o))o[h]=(r.cells[i]??'').trim();});return o;});
      if(!objs.length)rep.warn(null,'Le fichier ne contient que la ligne d\'en-têtes, aucune donnée.');
      parsed.push({rep,type,objs});
    }catch(e){rep.fatal='Lecture impossible : '+e.message;parsed.push({rep});}
  }
  parsed.sort((a,b)=>(a.type?IMPORT_ORDER.indexOf(a.type):99)-(b.type?IMPORT_ORDER.indexOf(b.type):99));
  // En mode « remplacer », un type n'est vidé qu'une fois : plusieurs fichiers du même type s'additionnent
  const cleared=new Set();
  for(const p of parsed)if(p.type){const m=(mode==='replace'&&!cleared.has(p.type))?'replace':'merge';cleared.add(p.type);
    if(m==='merge'&&mode==='replace')p.rep.warn(null,`Plusieurs fichiers « ${CSV_TYPES[p.type].label} » dans le même import : celui-ci complète le précédent.`);
    IMPORTERS[p.type](st,p.objs,m,p.rep);}
  const globalWarn=[];cleanRefs(st,globalWarn);
  pendingImport={st,reports:parsed.map(p=>p.rep),globalWarn,mode};
  renderImportReport();
}
function renderImportReport(){
  const {reports,globalWarn,mode}=pendingImport;let total=0;
  const lineTxt=l=>l?`Ligne ${l} : `:'';
  const parts=reports.map(r=>{
    total+=r.ok;
    if(r.fatal)return `<div class="imp-file"><h3>📄 ${esc(r.file)}</h3><div class="alert alert-err">${esc(r.fatal)}</div></div>`;
    const errs=r.errors.length?`<div class="alert alert-err"><b>${r.errors.length} ligne(s) en erreur, non importée(s) :</b><ul class="imp-list">${r.errors.map(e=>`<li>${esc(lineTxt(e.line)+e.msg)}</li>`).join('')}</ul></div>`:'';
    const warns=r.warnings.length?`<div class="alert alert-warn"><b>${r.warnings.length} remarque(s) :</b><ul class="imp-list">${r.warnings.map(e=>`<li>${esc(lineTxt(e.line)+e.msg)}</li>`).join('')}</ul></div>`:'';
    return `<div class="imp-file"><h3>📄 ${esc(r.file)} → ${esc(CSV_TYPES[r.type].label)}</h3>
      <small>Encodage : ${esc(r.enc)} · séparateur : ${esc(r.sep)}</small>
      <div class="alert ${r.ok?'alert-ok':'alert-warn'}">${r.ok} ligne(s) valide(s) prête(s) à être importée(s).</div>${errs}${warns}</div>`;
  }).join('');
  const gw=globalWarn.length?`<div class="alert alert-warn"><b>Cohérence générale :</b><ul class="imp-list">${globalWarn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:'';
  openModal(`<h2>Résultat de la vérification du fichier</h2>
    <p class="muted">Mode : <b>${mode==='replace'?'remplacer les données du même type':'ajouter / mettre à jour'}</b>. Rien n'a encore été modifié.</p>
    ${parts}${gw}
    ${total?`<p>Les lignes en erreur seront ignorées : corrigez-les dans le fichier puis réimportez-le si besoin.</p>`:''}
    <div class="btns">${total?`<button class="btn btn-primary" data-act="applyImport">✅ Importer les ${total} ligne(s) valide(s)</button>`:''}<button class="btn" data-act="closeModal">Annuler</button></div>`);
}

/* =====================================================================
   MOTEUR D'OPTIMISATION
   Règles strictes : présence de la personne, pas de double affectation
   (personne / professionnel / salle), disponibilités des professionnels,
   compatibilité et capacité des salles, capacité de l'activité,
   limite d'ateliers par personne et par jour, minimum de participants.
   Règles de préférence (dans cet ordre) : couvrir le nombre d'ateliers
   souhaité, priorité des personnes, équilibre entre familles de besoins,
   éviter de répéter la même activité, remplir les groupes existants.
   ===================================================================== */
function buildContext(st){
  const days=openDays(st),slots=sortedSlots(st).map(s=>s.id);
  const dsList=[];days.forEach(d=>slots.forEach(s=>dsList.push(d+'|'+s)));
  const famSet=new Set(st.families.map(f=>f.name));
  const proAvail=new Map(st.pros.map(p=>[p.code,new Set(dsList.filter(ds=>{const[d,s]=ds.split('|');return (p.avail[d]||[]).includes(s);}))]));
  const rooms=st.rooms.map(r=>({name:r.name,cap:r.capacity|0,fams:r.families||[]}));
  const activities=st.activities.filter(a=>famSet.has(a.family)).map(a=>({name:a.name,family:a.family,pros:a.pros.filter(c=>proAvail.has(c)),cap:Math.max(1,a.capacity|0||8),min:Math.max(1,effMin(a,st)),maxWeek:a.maxPerWeek|0}));
  activities.forEach(a=>{a.rooms=rooms.filter(r=>r.cap>0&&(!r.fams.length||r.fams.includes(a.family)));});
  const actByFam={};activities.forEach(a=>(actByFam[a.family]=actByFam[a.family]||[]).push(a));
  const persons=st.persons.map((p,i)=>{
    const needs=p.needs.filter(n=>famSet.has(n));const un=new Set(p.unavail||[]);
    const availList=dsList.filter(ds=>{const[d,s]=ds.split('|');return p.days.includes(d)&&!un.has(d+'-'+s);});
    const nAct=needs.reduce((n,f)=>n+(actByFam[f]||[]).length,0);
    return {idx:i,code:p.code,needs,needSet:new Set(needs),nb:Math.max(0,p.nb|0),prio:p.priority||1,avail:new Set(availList),availList,flex:availList.length*Math.max(1,nAct)};
  });
  const personsByFam={};st.families.forEach(f=>personsByFam[f.name]=persons.filter(p=>p.needSet.has(f.name)));
  return {days,slots,dsList,dsSet:new Set(dsList),persons,proAvail,activities,rooms,actByFam,personsByFam,maxPerDay:st.settings.maxPerDay,
    actByName:new Map(activities.map(a=>[a.name,a])),roomByName:new Map(rooms.map(r=>[r.name,r])),personByCode:new Map(persons.map(p=>[p.code,p]))};
}

function solveOnce(ctx,locked,rng){
  const P=ctx.persons;
  const sol={sessions:[],busyPro:new Set(),busyRoom:new Set(),busyP:P.map(()=>new Set()),dayCnt:P.map(()=>({})),actCnt:P.map(()=>({})),famCnt:P.map(()=>({})),got:P.map(()=>0),actWeek:new Map(),proLoad:new Map()};
  const remaining=p=>p.nb-sol.got[p.idx];
  const dayOf=ds=>ds.slice(0,3);
  const personFree=(p,ds)=>p.avail.has(ds)&&!sol.busyP[p.idx].has(ds)&&(sol.dayCnt[p.idx][dayOf(ds)]||0)<ctx.maxPerDay;
  const quota=p=>Math.ceil(p.nb/Math.max(1,p.needs.length));
  const actOk=(p,a,level)=>{
    if(!p.needSet.has(a.family))return false;
    if(level>=2&&(sol.famCnt[p.idx][a.family]||0)>=quota(p))return false;   // équilibre entre familles
    if(level>=1&&(sol.actCnt[p.idx][a.name]||0)>=1)return false;            // pas deux fois la même activité
    return true;
  };
  const canJoin=(p,s,level)=>remaining(p)>0&&s.parts.length<s.cap&&personFree(p,s.ds)&&actOk(p,s.act,level);
  function assign(p,s){s.parts.push(p.idx);sol.busyP[p.idx].add(s.ds);const d=dayOf(s.ds);
    sol.dayCnt[p.idx][d]=(sol.dayCnt[p.idx][d]||0)+1;sol.actCnt[p.idx][s.act.name]=(sol.actCnt[p.idx][s.act.name]||0)+1;
    sol.famCnt[p.idx][s.act.family]=(sol.famCnt[p.idx][s.act.family]||0)+1;sol.got[p.idx]++;}
  function unassign(p,s){s.parts.splice(s.parts.indexOf(p.idx),1);sol.busyP[p.idx].delete(s.ds);const d=dayOf(s.ds);
    sol.dayCnt[p.idx][d]--;sol.actCnt[p.idx][s.act.name]--;sol.famCnt[p.idx][s.act.family]--;sol.got[p.idx]--;}
  function open(a,ds,pro,room){const s={act:a,ds,day:ds.slice(0,3),slot:ds.slice(4),pro,room,cap:Math.min(a.cap,room.cap),parts:[],locked:false};
    sol.sessions.push(s);sol.busyPro.add(pro+'|'+ds);sol.busyRoom.add(room.name+'|'+ds);
    sol.actWeek.set(a.name,(sol.actWeek.get(a.name)||0)+1);sol.proLoad.set(pro,(sol.proLoad.get(pro)||0)+1);return s;}
  function close(s){for(const i of s.parts.slice())unassign(P[i],s);sol.sessions.splice(sol.sessions.indexOf(s),1);
    sol.busyPro.delete(s.pro+'|'+s.ds);sol.busyRoom.delete(s.room.name+'|'+s.ds);
    sol.actWeek.set(s.act.name,sol.actWeek.get(s.act.name)-1);sol.proLoad.set(s.pro,sol.proLoad.get(s.pro)-1);}

  // 1) Ateliers verrouillés (décisions manuelles) : conservés tels quels
  for(const ls of locked){
    const a=ctx.actByName.get(ls.activity),room=ctx.roomByName.get(ls.room),ds=ls.day+'|'+ls.slot;
    if(!a||!room||!ctx.dsSet.has(ds)||sol.busyPro.has(ls.pro+'|'+ds)||sol.busyRoom.has(room.name+'|'+ds))continue;
    const s=open(a,ds,ls.pro,room);s.locked=true;s.cap=Math.max(s.cap,ls.participants.length);
    for(const c of ls.participants){const p=ctx.personByCode.get(c);if(p&&!sol.busyP[p.idx].has(ds))assign(p,s);}
  }

  function bestNew(p,level){
    let best=null,bsc=-Infinity;
    for(const fam of p.needs)for(const a of (ctx.actByFam[fam]||[])){
      if(!actOk(p,a,level))continue;
      if(a.maxWeek>0&&(sol.actWeek.get(a.name)||0)>=a.maxWeek)continue;
      if(!a.pros.length||!a.rooms.length)continue;
      for(const ds of p.availList){
        if(!personFree(p,ds))continue;
        let pro=null,pl=Infinity;
        for(const c of a.pros){if(ctx.proAvail.get(c).has(ds)&&!sol.busyPro.has(c+'|'+ds)){const l=(sol.proLoad.get(c)||0)+rng()*0.9;if(l<pl){pl=l;pro=c;}}}
        if(!pro)continue;
        let room=null;
        for(const r of a.rooms){if(sol.busyRoom.has(r.name+'|'+ds))continue;
          if(!room){room=r;continue;}
          const okR=r.cap>=a.cap,okB=room.cap>=a.cap;
          if(okR&&(!okB||r.cap<room.cap))room=r;else if(!okR&&!okB&&r.cap>room.cap)room=r;}
        if(!room)continue;
        const cap=Math.min(a.cap,room.cap);
        let pot=0;for(const q of ctx.personsByFam[a.family]){if(q!==p&&remaining(q)>0&&personFree(q,ds)&&actOk(q,a,level))pot++;}
        const group=Math.min(cap,pot+1);
        if(group<a.min)continue;
        const sc=group*3-(sol.famCnt[p.idx][fam]||0)*2-pl*0.3+rng()*2;
        if(sc>bsc){bsc=sc;best={a,ds,pro,room};}
      }
    }
    return best;
  }
  function fill(s,level){
    const c=ctx.personsByFam[s.act.family].filter(q=>canJoin(q,s,level)).map(q=>({q,k:q.prio*100+remaining(q)*10+rng()*5})).sort((x,y)=>y.k-x.k);
    for(const {q} of c){if(s.parts.length>=s.cap)break;if(canJoin(q,s,level))assign(q,s);}
  }
  function runLevel(level,allowOpen){
    let progress=true,guard=0;
    while(progress&&guard++<200){
      progress=false;
      const order=P.filter(p=>remaining(p)>0&&p.needs.length).map(p=>({p,k:p.prio*10+remaining(p)/(p.flex+1)*5+rng()*3})).sort((x,y)=>y.k-x.k);
      for(const {p} of order){
        if(remaining(p)<=0)continue;
        let bs=null,bk=-Infinity;
        for(const s of sol.sessions){if(!canJoin(p,s,level))continue;const k=(s.parts.length<s.act.min?5:0)+(1-s.parts.length/s.cap)+rng()*0.5;if(k>bk){bk=k;bs=s;}}
        if(bs){assign(p,bs);progress=true;continue;}
        if(!allowOpen)continue;
        const c=bestNew(p,level);
        if(c){const s=open(c.a,c.ds,c.pro,c.room);assign(p,s);fill(s,level);progress=true;}
      }
    }
  }
  // 2) Construction progressive : règles de préférence strictes puis assouplies
  for(const lv of [2,1,0])runLevel(lv,true);
  // 3) Groupes sous le minimum : dissous puis tentative de réaffectation
  for(let k=0;k<4;k++){const under=sol.sessions.filter(s=>!s.locked&&s.parts.length<s.act.min);if(!under.length)break;under.forEach(close);runLevel(0,true);}
  sol.sessions.filter(s=>!s.locked&&s.parts.length<s.act.min).forEach(close);
  runLevel(0,false);
  return sol;
}
function scoreSol(ctx,sol){
  let sc=0;
  for(const p of ctx.persons){
    const got=Math.min(sol.got[p.idx],p.nb),sh=p.nb-got;
    sc+=got*100-p.prio*sh*sh*40+(sh===0&&p.nb>0?25:0);
    for(const k in sol.actCnt[p.idx]){const c=sol.actCnt[p.idx][k];if(c>1)sc-=(c-1)*12;}
    sc+=p.needs.filter(f=>(sol.famCnt[p.idx][f]||0)>0).length*4;
  }
  return sc-sol.sessions.length*2;
}
function optimize(st){
  const ctx=buildContext(st);
  const locked=st.plan?st.plan.sessions.filter(s=>s.locked):[];
  const n=Math.max(1,Math.min(500,st.settings.iterations|0||60));
  const seed=(Date.now()%1000000007)|0;const t0=performance.now();
  let best=null,bs=-Infinity,runs=0;
  for(let i=0;i<n;i++){
    const sol=solveOnce(ctx,locked,mulberry32(seed+i*7919));const sc=scoreSol(ctx,sol);runs++;
    if(sc>bs){bs=sc;best=sol;}
    if(performance.now()-t0>8000)break;
  }
  return {
    sessions:best.sessions.map(s=>({id:uid(),activity:s.act.name,family:s.act.family,day:s.day,slot:s.slot,pro:s.pro,room:s.room.name,participants:s.parts.map(i=>ctx.persons[i].code).sort(byCode),locked:!!s.locked})),
    generatedAt:new Date().toLocaleString('fr-FR'),runs,duration:Math.round(performance.now()-t0)
  };
}

/* ---------- Index d'un agenda (occupations) ---------- */
function planIndex(st,plan,excludeId){
  const busyP=new Map(),dayCnt=new Map(),busyPro=new Map(),busyRoom=new Map(),got=new Map(),actWeek=new Map();
  if(plan)for(const s of plan.sessions){
    if(s.id===excludeId)continue;const ds=s.day+'|'+s.slot;
    busyPro.set(s.pro+'|'+ds,s);busyRoom.set(s.room+'|'+ds,s);actWeek.set(s.activity,(actWeek.get(s.activity)||0)+1);
    for(const c of s.participants){if(!busyP.has(c))busyP.set(c,new Map());busyP.get(c).set(ds,s);
      dayCnt.set(c+'|'+s.day,(dayCnt.get(c+'|'+s.day)||0)+1);got.set(c,(got.get(c)||0)+1);}
  }
  return {busyP,dayCnt,busyPro,busyRoom,got,actWeek};
}

/* ---------- Analyse : récapitulatif et raisons ---------- */
function diagnosePerson(st,plan,idx,p){
  const R=(cat,msg)=>({cat,msg});const out=[];
  const days=openDays(st),slots=sortedSlots(st).map(s=>s.id);
  if(!p.days.length)return [R('Données','Aucun jour de présence renseigné.')];
  const pdays=p.days.filter(d=>days.includes(d));
  if(!pdays.length)return [R('Données',"Ses jours de présence ne correspondent à aucun jour d'ouverture de la structure.")];
  const fams=new Set(st.families.map(f=>f.name));const needs=p.needs.filter(n=>fams.has(n));
  if(!needs.length)return [R('Données',"Aucun besoin (famille d'activités) renseigné.")];
  const noAct=needs.filter(f=>!st.activities.some(a=>a.family===f));
  if(noAct.length)out.push(R('Données',`Aucune activité n'est définie pour : ${noAct.join(', ')}.`));
  const acts=st.activities.filter(a=>needs.includes(a.family));
  if(!acts.length)return out;
  const un=new Set(p.unavail||[]);const possible=[];
  pdays.forEach(d=>slots.forEach(s=>{if(!un.has(d+'-'+s))possible.push(d+'|'+s);}));
  const maxPossible=Math.min(possible.length,pdays.length*st.settings.maxPerDay);
  if(maxPossible<p.nb)out.push(R('Créneaux',`Au maximum ${maxPossible} atelier(s) possible(s) sur ses jours de présence (${pdays.length} jour(s), ${st.settings.maxPerDay} atelier(s) par jour au plus) pour ${p.nb} souhaité(s).`));
  const free=possible.filter(ds=>!idx.busyP.get(p.code)?.has(ds)&&(idx.dayCnt.get(p.code+'|'+ds.slice(0,3))||0)<st.settings.maxPerDay);
  if(!free.length){out.push(R('Créneaux',"Tous ses créneaux de présence encore possibles sont déjà occupés par d'autres ateliers (ou la limite d'ateliers par jour est atteinte)."));return out;}
  const c={noPro:0,proBusy:0,noRoom:0,roomBusy:0,full:0,maxWeek:0,openable:0,joinable:0};
  let minNeeded=Infinity;
  for(const ds of free)for(const a of acts){
    const sess=plan.sessions.filter(s=>s.activity===a.name&&s.day+'|'+s.slot===ds);
    if(sess.length){if(sess.some(s=>s.participants.length<sessCap(st,s)))c.joinable++;else c.full++;continue;}
    const av=a.pros.filter(pc=>proAvailable(st,pc,ds));
    if(!av.length){c.noPro++;continue;}
    if(!av.some(pc=>!idx.busyPro.has(pc+'|'+ds))){c.proBusy++;continue;}
    const rooms=compatibleRooms(st,a);
    if(!rooms.length){c.noRoom++;continue;}
    if(!rooms.some(r=>!idx.busyRoom.has(r.name+'|'+ds))){c.roomBusy++;continue;}
    if(a.maxPerWeek>0&&(idx.actWeek.get(a.name)||0)>=a.maxPerWeek){c.maxWeek++;continue;}
    c.openable++;minNeeded=Math.min(minNeeded,effMin(a,st));
  }
  const fl=acts.map(a=>a.name).join(', ');
  const msgs=[
    ['noPro','Professionnel',`Aucun animateur de ses activités (${fl}) n'est disponible sur ses créneaux libres → élargir les disponibilités ou ajouter un animateur.`],
    ['proBusy','Professionnel',"Les animateurs concernés sont déjà pris par d'autres ateliers sur ses créneaux libres."],
    ['noRoom','Salle',"Aucune salle n'est compatible avec ses activités → vérifier les familles accueillies par les salles."],
    ['roomBusy','Salle','Les salles compatibles sont déjà occupées sur ses créneaux libres.'],
    ['full','Capacité','Les ateliers compatibles programmés sur ses créneaux libres sont complets (capacité atteinte).'],
    ['maxWeek','Capacité','Le nombre maximum de séances par semaine est atteint pour ses activités.'],
    ['openable','Groupe',`Un atelier pourrait être ouvert, mais pas assez d'autres personnes disponibles au même moment pour atteindre le minimum de ${minNeeded===Infinity?st.settings.defaultMin:minNeeded} participant(s) → baisser ce minimum ou ajuster jours / besoins.`],
    ['joinable','Capacité','Des places restent libres dans des ateliers compatibles : une affectation manuelle est possible.']
  ].filter(m=>c[m[0]]>0).sort((x,y)=>c[y[0]]-c[x[0]]);
  msgs.forEach(m=>out.push(R(m[1],m[2])));
  return out;
}
function analyze(st,plan){
  const idx=planIndex(st,plan);const rows=[];let demand=0,obtained=0,complete=0,partial=0,none=0;
  for(const p of st.persons){
    const got=idx.got.get(p.code)||0,nb=p.nb|0;demand+=nb;obtained+=Math.min(got,nb);
    let status='complet';if(got<nb)status=got===0?'non':'partiel';
    if(status==='complet')complete++;else if(status==='partiel')partial++;else none++;
    rows.push({code:p.code,nb,got,status,priority:p.priority||1,reasons:status==='complet'?[]:diagnosePerson(st,plan,idx,p)});
  }
  const alerts=[];const fams=new Set(st.families.map(f=>f.name));
  st.families.forEach(f=>{const n=st.persons.filter(p=>p.needs.includes(f.name)).length;if(n&&!st.activities.some(a=>a.family===f.name))alerts.push(`La famille « ${f.name} » est demandée par ${n} personne(s) mais aucune activité ne lui est rattachée.`);});
  st.activities.forEach(a=>{
    if(!fams.has(a.family))alerts.push(`L'activité « ${a.name} » est rattachée à une famille inexistante (${a.family}).`);
    if(!a.pros.length)alerts.push(`L'activité « ${a.name} » n'a aucun animateur.`);
    else if(!a.pros.some(c=>{const p=st.pros.find(x=>x.code===c);return p&&openDays(st).some(d=>(p.avail[d]||[]).length);}))alerts.push(`Les animateurs de « ${a.name} » n'ont aucune disponibilité saisie.`);
    if(!compatibleRooms(st,a).length)alerts.push(`Aucune salle n'est compatible avec l'activité « ${a.name} ».`);
  });
  st.pros.forEach(p=>{if(!openDays(st).some(d=>(p.avail[d]||[]).length))alerts.push(`${p.code} n'a aucune disponibilité saisie.`);});
  return {rows,alerts,demand,obtained,complete,partial,none,idx};
}

/* ---------- Grille jours × créneaux ---------- */
function grid(name,checked){
  const days=openDays(),slots=sortedSlots();
  if(!days.length||!slots.length)return '<p class="muted">Définissez d\'abord les jours d\'ouverture et les créneaux (onglet Paramètres).</p>';
  let h=`<table class="grid"><thead><tr><th><small>Cliquer sur un jour ou un créneau pour tout cocher</small></th>${days.map(d=>`<th><button type="button" class="linkbtn" data-act="gridDay" data-grid="${name}" data-day="${d}">${DAY_LABEL[d]}</button></th>`).join('')}</tr></thead><tbody>`;
  for(const s of slots)h+=`<tr><th><button type="button" class="linkbtn" data-act="gridSlot" data-grid="${name}" data-slot="${esc(s.id)}">${esc(s.label||s.id)}</button><br><small>${s.start}–${s.end}</small></th>`+
    days.map(d=>`<td><input type="checkbox" name="${name}" value="${d}|${esc(s.id)}" ${checked.has(d+'|'+s.id)?'checked':''} aria-label="${DAY_LABEL[d]} ${esc(s.label||s.id)}"></td>`).join('')+'</tr>';
  return h+'</tbody></table>';
}
const gridValues=name=>[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i=>i.value);
const checkedValues=name=>[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i=>i.value);

function agendaRows(st){
  const rows=[['jour','creneau','debut','fin','activite','famille','animateur','salle','nb_participants','capacite','participants','verrouille']];
  for(const s of sortedSessions(st))rows.push([DAY_LABEL[s.day],s.slot,slotById(st,s.slot).start,slotById(st,s.slot).end,s.activity,s.family,s.pro,s.room,s.participants.length,sessCap(st,s),s.participants.join(','),s.locked?'oui':'non']);
  return rows;
}
function slotById(st,id){return st.slots.find(s=>s.id===id)||{start:'',end:'',label:id};}
function sortedSessions(st){const so=sortedSlots(st).map(s=>s.id);return st.plan.sessions.slice().sort((a,b)=>DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day)||so.indexOf(a.slot)-so.indexOf(b.slot)||a.activity.localeCompare(b.activity,'fr'));}
function exportPersonAgenda(){
  if(!S.plan)return;const rows=[['personne','jour','creneau','debut','fin','activite','famille','animateur','salle']];
  const ss=sortedSessions(S);
  S.persons.slice().sort((a,b)=>byCode(a.code,b.code)).forEach(p=>ss.filter(s=>s.participants.includes(p.code)).forEach(s=>{const sl=slotById(S,s.slot);rows.push([p.code,DAY_LABEL[s.day],s.slot,sl.start,sl.end,s.activity,s.family,s.pro,s.room]);}));
  download('agenda_par_personne.csv',toCSV(rows,exportSep()));
}
function exportRecap(){
  if(!S.plan)return;const an=analyze(S,S.plan);
  const rows=[['personne','ateliers_souhaites','ateliers_obtenus','statut','raisons']];
  an.rows.forEach(r=>rows.push([r.code,r.nb,r.got,{complet:'Complet',partiel:'Partiellement affecté',non:'Non affecté'}[r.status],r.reasons.map(x=>`[${x.cat}] ${x.msg}`).join(' | ')]));
  download('recapitulatif_affectations.csv',toCSV(rows,exportSep()));
}

/* ---------- Édition manuelle d'un atelier ---------- */
function personCheck(code,d,idx,a){
  const p=S.persons.find(x=>x.code===code);if(!p)return {err:'personne inconnue'};
  const ds=d.day+'|'+d.slot;
  if(!p.days.includes(d.day))return {err:`absent(e) le ${DAY_LABEL[d.day].toLowerCase()}`};
  if((p.unavail||[]).includes(d.day+'-'+d.slot))return {err:'créneau à éviter pour cette personne'};
  const o=idx.busyP.get(code)?.get(ds);if(o)return {err:`déjà dans « ${o.activity} » sur ce créneau`};
  const w=[];
  if(a&&!p.needs.includes(a.family))w.push(`« ${a.family} » ne fait pas partie de ses besoins`);
  const dc=idx.dayCnt.get(code+'|'+d.day)||0;if(dc+1>S.settings.maxPerDay)w.push(`dépasse la limite de ${S.settings.maxPerDay} atelier(s) par jour`);
  const g=(idx.got.get(code)||0)+1;if(g>p.nb)w.push(`aurait ${g} ateliers pour ${p.nb} souhaité(s)`);
  return {warn:w.join(' ; ')};
}
function validateDraft(d){
  const errors=[],warnings=[],partErr={};const idx=planIndex(S,S.plan,d.id);const ds=d.day+'|'+d.slot;
  const a=S.activities.find(x=>x.name===d.activity),r=S.rooms.find(x=>x.name===d.room),pr=S.pros.find(x=>x.code===d.pro);
  if(!a)errors.push('Choisissez une activité.');
  if(!pr)errors.push('Choisissez un animateur.');
  if(!r)errors.push('Choisissez une salle.');
  if(pr){const o=idx.busyPro.get(d.pro+'|'+ds);if(o)errors.push(`${d.pro} anime déjà « ${o.activity} » sur ce créneau.`);
    if(!proAvailable(S,d.pro,ds))warnings.push(`${d.pro} n'est pas indiqué(e) disponible sur ce créneau.`);
    if(a&&!a.pros.includes(d.pro))warnings.push(`${d.pro} ne fait pas partie des animateurs prévus pour « ${a.name} ».`);}
  if(r){const o=idx.busyRoom.get(d.room+'|'+ds);if(o)errors.push(`La salle « ${d.room} » est déjà occupée par « ${o.activity} » sur ce créneau.`);
    if(a&&r.families.length&&!r.families.includes(a.family))warnings.push(`La salle « ${r.name} » n'est pas prévue pour la famille « ${a.family} ».`);}
  const cap=Math.min(a?a.capacity:Infinity,r?r.capacity:Infinity);
  if(d.participants.length>cap)errors.push(`Trop de participants : ${d.participants.length} pour ${cap} place(s).`);
  if(a&&d.participants.length<effMin(a))warnings.push(`Moins de participants que le minimum prévu (${effMin(a)}).`);
  for(const c of d.participants){const k=personCheck(c,d,idx,a);if(k.err)partErr[c]=k.err;else if(k.warn)warnings.push(`${c} : ${k.warn}.`);}
  if(Object.keys(partErr).length)errors.push('Certains participants ne peuvent pas être présents sur ce créneau (en rouge ci-dessous).');
  return {errors,warnings,partErr,cap,idx,a};
}

/* ---------- Génération ---------- */
function generate(){
  const pb=[];
  if(!S.settings.openDays.length)pb.push("Aucun jour d'ouverture (onglet Paramètres).");
  if(!S.slots.length)pb.push('Aucun créneau horaire (onglet Paramètres).');
  if(!S.pros.length)pb.push('Aucun professionnel (onglet Professionnels).');
  if(!S.rooms.length)pb.push('Aucune salle (onglet Salles).');
  if(!S.activities.length)pb.push('Aucune activité (onglet Activités).');
  if(!S.persons.length)pb.push('Aucune personne accompagnée (onglet Personnes).');
  if(pb.length){openModal(`<h2>Données incomplètes</h2><p>Impossible de générer l'agenda pour l'instant :</p><div class="alert alert-warn"><ul>${pb.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="btns"><button class="btn" data-act="closeModal">Fermer</button></div>`);return;}
  if(S.plan&&S.plan.sessions.some(s=>!s.locked)&&!confirm("Générer un nouvel agenda remplace l'agenda actuel.\nLes ateliers verrouillés 🔒 seront conservés.\n\nContinuer ?"))return;
  $('#overlay').hidden=false;
  setTimeout(()=>{
    try{sanitizePlan(S);S.plan=optimize(S);S.planStale=false;persist();currentTab='agenda';UI.filter='all';render();
      const an=analyze(S,S.plan);toast(`Agenda généré : ${an.obtained} atelier(s) attribué(s) sur ${an.demand} souhaité(s).`);window.scrollTo(0,0);}
    catch(e){console.error(e);toast('Erreur inattendue pendant le calcul : '+e.message,'err');}
    finally{$('#overlay').hidden=true;}
  },60);
}

    let fam=UI.filter.startsWith('fam:')?UI.filter.slice(4):null;
    const a=S.activities.find(x=>!fam||x.family===fam)||S.activities[0];
    const pro=a.pros.find(c=>proAvailable(S,c,ds)&&!idx.busyPro.has(c+'|'+ds))||(UI.filter.startsWith('pro:')?UI.filter.slice(4):'');
    const room=(compatibleRooms(S,a).find(r=>!idx.busyRoom.has(r.name+'|'+ds))||{}).name||(UI.filter.startsWith('room:')?UI.filter.slice(5):'');
    const parts=UI.filter.startsWith('person:')?[UI.filter.slice(7)]:[];
    draft={id:uid(),activity:a.name,family:a.family,day,slot,pro,room,participants:parts,locked:true,isNew:true};renderDraft();},
  dRemove:b=>{draft.participants=draft.participants.filter(c=>c!==b.dataset.code);touchDraft();},
  dRemoveConflicts:()=>{const v=validateDraft(draft);draft.participants=draft.participants.filter(c=>!v.partErr[c]);touchDraft();},
  dSave:()=>{const v=validateDraft(draft);if(v.errors.length)return toast(v.errors[0],'err');
    const s={id:draft.id,activity:draft.activity,family:v.a.family,day:draft.day,slot:draft.slot,pro:draft.pro,room:draft.room,participants:draft.participants.slice().sort(byCode),locked:!!draft.locked};
    const i=S.plan.sessions.findIndex(x=>x.id===s.id);if(i>=0)S.plan.sessions[i]=s;else S.plan.sessions.push(s);
    draft=null;closeModal();planChanged();render();toast('Atelier enregistré.');},
  dDelete:()=>{if(!confirm('Supprimer cet atelier de l\'agenda ?'))return;S.plan.sessions=S.plan.sessions.filter(x=>x.id!==draft.id);draft=null;closeModal();planChanged();render();},
  closeModal:()=>closeModal()
};
/* ---------- Changements de champs ---------- */
const CHANGES={
  openDay:el=>{const d=el.value;S.settings.openDays=el.checked?sortDays([...S.settings.openDays,d]):S.settings.openDays.filter(x=>x!==d);sanitizePlan(S);changed();render();},
  slotField:el=>{const i=+el.dataset.i,f=el.dataset.f,s=S.slots[i],v=el.value.trim();
    if(f==='id'){
      if(!/^[A-Za-z0-9_]{1,10}$/.test(v)){toast('Code de créneau invalide : lettres et chiffres uniquement, sans espace ni accent (ex. M1).','err');el.value=s.id;return;}
      if(S.slots.some((o,j)=>j!==i&&sameKey(o.id,v))){toast('Ce code de créneau existe déjà.','err');el.value=s.id;return;}
      renameSlot(s.id,v);}
    else if(f==='start'||f==='end'){const t=normTime(v);if(!t){toast('Heure invalide (format HH:MM).','err');el.value=s[f];return;}
      const ns={...s,[f]:t};if(ns.start>=ns.end){toast("L'heure de fin doit être après l'heure de début.",'err');el.value=s[f];return;}
      s[f]=t;S.slots.sort((a,b)=>a.start.localeCompare(b.start));}
    else s.label=v;
    changed();render();},
  famName:el=>{const f=S.families[+el.dataset.i],v=el.value.trim();
    if(!v||badChars(v)){toast('Nom de famille vide ou contenant ; , | ou guillemets.','err');el.value=f.name;return;}
    if(S.families.some(x=>x!==f&&sameKey(x.name,v))){toast('Cette famille existe déjà.','err');el.value=f.name;return;}
    const old=f.name;f.name=v;renameFamily(old,v);changed();render();},
  famColor:el=>{S.families[+el.dataset.i].color=el.value;persist();},
  setting:el=>{const k=el.dataset.key;
    if(k==='csvSep'){S.settings.csvSep=el.value;persist();return;}
    const lim={maxPerDay:[1,10],defaultMin:[1,50],iterations:[1,500]}[k];const n=intStrict(el.value);
    if(!(n>=lim[0]&&n<=lim[1])){toast(`Valeur invalide : nombre entier entre ${lim[0]} et ${lim[1]}.`,'err');el.value=S.settings[k];return;}
    S.settings[k]=n;changed();},
  persist:el=>{
    if(el.checked){if(!confirm("Les données seront mémorisées dans le stockage local de ce navigateur, sur ce poste uniquement (aucun envoi).\nToute personne utilisant la même session de ce poste pourra les voir.\nÀ réserver à un poste professionnel personnel et sécurisé.\n\nActiver ?")){el.checked=false;return;}setPersist(true);toast('Mémorisation activée sur ce poste.');}
    else{setPersist(false);toast('Mémorisation désactivée : les données mémorisées ont été effacées du navigateur.');}
    render();},
  agendaFilter:el=>{UI.filter=el.value;render();},
  showParts:el=>{UI.showParts=el.checked;render();},
  dAct:el=>{draft.activity=el.value;const a=S.activities.find(x=>x.name===el.value);
    if(a&&!a.pros.includes(draft.pro)){const idx=planIndex(S,S.plan,draft.id),ds=draft.day+'|'+draft.slot;const p=a.pros.find(c=>proAvailable(S,c,ds)&&!idx.busyPro.has(c+'|'+ds));if(p)draft.pro=p;}
    touchDraft();},
  dDs:el=>{const[d,s]=el.value.split('|');draft.day=d;draft.slot=s;touchDraft();},
  dPro:el=>{draft.pro=el.value;touchDraft();},
  dRoom:el=>{draft.room=el.value;touchDraft();},
  dLock:el=>{draft.locked=el.checked;draft.lockTouched=true;},
  dAdd:el=>{if(el.value&&!draft.participants.includes(el.value))draft.participants.push(el.value);touchDraft();}
};

/* ---------- Écouteurs ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACTIONS[b.dataset.act];if(f){e.preventDefault();f(b,e);}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const f=CHANGES[el.dataset.change];if(f)f(el,e);});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.input==='personSearch'){UI.personSearch=e.target.value;const t=$('#persons-table');if(t)t.innerHTML=personsTable();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act]:not(button):not(input):not(select)')){e.preventDefault();e.target.click();}});
$('#file-input').addEventListener('change',e=>{const f=e.target.files;handleImportFiles(f).finally(()=>{e.target.value='';});});
// Empêche le navigateur d'ouvrir un fichier déposé par erreur (ce qui ferait perdre la saisie)
document.addEventListener('dragover',e=>{e.preventDefault();const z=e.target.closest&&e.target.closest('#dropzone');document.querySelectorAll('.dropzone').forEach(d=>d.classList.toggle('over',d===z));});
document.addEventListener('dragleave',e=>{if(e.target.classList&&e.target.classList.contains('dropzone'))e.target.classList.remove('over');});
document.addEventListener('drop',e=>{e.preventDefault();const z=e.target.closest&&e.target.closest('#dropzone');document.querySelectorAll('.dropzone').forEach(d=>d.classList.remove('over'));
  if(z&&e.dataTransfer&&e.dataTransfer.files.length)handleImportFiles(e.dataTransfer.files);
  else if(e.dataTransfer&&e.dataTransfer.files.length)toast("Pour importer, déposez les fichiers dans le cadre de l'onglet « Import / Export CSV ».",'err');});
$('#modal').addEventListener('close',()=>{draft=null;pendingImport=null;});
window.addEventListener('beforeunload',e=>{if(!S.settings.persist&&(S.persons.length||S.pros.length||S.activities.length||S.plan)){e.preventDefault();e.returnValue='';}});

/* ---------- Démarrage ---------- */
if(loadPersisted())toast('Données mémorisées sur ce poste rechargées.');
render();
</script>
</body>
</html>
