<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDJ Planning — Hôpital de Jour</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
  <style>
/* ============================================================
   HDJ PLANNING — Styles principaux
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --c-navy:    #1A3A5C;
  --c-navy-lt: #2A5080;
  --c-teal:    #2A9D8F;
  --c-teal-lt: #3DBFB0;
  --c-orange:  #E76F51;
  --c-amber:   #F4A261;
  --c-bg:      #F0F4F8;
  --c-surface: #FFFFFF;
  --c-border:  #D0DAE6;
  --c-slate:   #5A6A7A;
  --c-text:    #1C2B3A;
  --c-muted:   #8A9BB0;
  --c-error:   #D64045;
  --c-success: #2A9D8F;

  /* Catégories de médiation */
  --cat-arts:    #7B68EE;
  --cat-sport:   #20B2AA;
  --cat-music:   #FF7F50;
  --cat-cuisine: #DAA520;
  --cat-nature:  #3CB371;
  --cat-jeu:     #FF69B4;
  --cat-drama:   #CD853F;
  --cat-yoga:    #9370DB;
  --cat-autre:   #708090;

  --radius-sm: 4px;
  --radius:    8px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(26,58,92,.08);
  --shadow:    0 4px 12px rgba(26,58,92,.12);
  --shadow-lg: 0 8px 32px rgba(26,58,92,.18);

  --sidebar-w: 240px;
  --topbar-h:  56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 14px; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---- SCROLLBAR ---- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--c-muted); }

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ---- SIDEBAR ---- */
#sidebar {
  width: var(--sidebar-w);
  background: var(--c-navy);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 100;
  transition: width .25s ease;
}

.sidebar-logo {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-logo-icon {
  width: 28px; height: 28px;
  background: var(--c-teal);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.sidebar-logo-text {
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .3px;
  line-height: 1.2;
}
.sidebar-logo-sub {
  color: rgba(255,255,255,.45);
  font-size: 10px;
  font-weight: 400;
}

.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }

.nav-section-label {
  padding: 8px 16px 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: rgba(255,255,255,.3);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  color: rgba(255,255,255,.65);
  cursor: pointer;
  border-radius: 0;
  transition: background .15s, color .15s;
  font-size: 13px;
  font-weight: 400;
  border-left: 2px solid transparent;
  user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.active {
  background: rgba(42,157,143,.18);
  color: #fff;
  border-left-color: var(--c-teal);
  font-weight: 500;
}
.nav-item .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  background: var(--c-orange);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 11px;
  color: rgba(255,255,255,.3);
}
.sidebar-unit-selector {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 16px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-unit-selector label { font-size: 10px; color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: .6px; }
.sidebar-unit-selector select {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.15);
  color: #fff;
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  font-size: 12px;
  outline: none;
  cursor: pointer;
}
.sidebar-unit-selector select option { background: var(--c-navy); }

/* ---- MAIN AREA ---- */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- TOPBAR ---- */
#topbar {
  height: var(--topbar-h);
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 50;
}
.topbar-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--c-text);
}
.topbar-subtitle {
  font-size: 12px;
  color: var(--c-muted);
}
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

/* ---- PAGE CONTENT ---- */
#page-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all .15s;
  white-space: nowrap;
  font-family: inherit;
}
.btn-primary { background: var(--c-navy); color: #fff; }
.btn-primary:hover { background: var(--c-navy-lt); }
.btn-teal { background: var(--c-teal); color: #fff; }
.btn-teal:hover { background: var(--c-teal-lt); }
.btn-outline {
  background: transparent;
  color: var(--c-navy);
  border: 1.5px solid var(--c-border);
}
.btn-outline:hover { border-color: var(--c-navy); background: var(--c-bg); }
.btn-danger { background: var(--c-error); color: #fff; }
.btn-danger:hover { background: #b83038; }
.btn-ghost { background: transparent; color: var(--c-slate); border: none; }
.btn-ghost:hover { background: var(--c-bg); color: var(--c-text); }
.btn-sm { padding: 5px 10px; font-size: 11.5px; }
.btn-icon { padding: 6px; border-radius: var(--radius-sm); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ============================================================
   CARDS & PANELS
   ============================================================ */
.card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--c-border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title { font-size: 13.5px; font-weight: 600; }
.card-body { padding: 16px 18px; }
.card-footer {
  padding: 12px 18px;
  border-top: 1px solid var(--c-border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ============================================================
   FORMS
   ============================================================ */
.form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--c-slate); }
.form-label.required::after { content: ' *'; color: var(--c-error); }
.form-control {
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius);
  padding: 8px 11px;
  font-size: 13px;
  font-family: inherit;
  color: var(--c-text);
  background: var(--c-surface);
  outline: none;
  transition: border-color .15s;
  width: 100%;
}
.form-control:focus { border-color: var(--c-teal); }
.form-control::placeholder { color: var(--c-muted); }
.form-control.error { border-color: var(--c-error); }
.form-row { display: grid; gap: 12px; }
.form-row.cols-2 { grid-template-columns: 1fr 1fr; }
.form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-hint { font-size: 11px; color: var(--c-muted); }
.form-error { font-size: 11px; color: var(--c-error); }

select.form-control { cursor: pointer; }
textarea.form-control { resize: vertical; min-height: 72px; }

/* Checkbox / Toggle */
.checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  transition: all .15s;
  user-select: none;
}
.checkbox-item:hover { border-color: var(--c-teal); background: rgba(42,157,143,.05); }
.checkbox-item.checked { border-color: var(--c-teal); background: rgba(42,157,143,.1); color: var(--c-teal); font-weight: 500; }
.checkbox-item input { display: none; }

/* Day-slot matrix */
.day-slot-matrix { display: grid; grid-template-columns: auto repeat(5, 1fr); gap: 4px; }
.day-slot-matrix .header { font-size: 11px; font-weight: 600; color: var(--c-muted); text-align: center; padding: 4px; }
.day-slot-matrix .row-label { font-size: 11px; color: var(--c-slate); display: flex; align-items: center; padding-right: 8px; }
.slot-cell {
  aspect-ratio: 1;
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .15s;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  min-width: 36px; min-height: 28px;
}
.slot-cell:hover { border-color: var(--c-teal); background: rgba(42,157,143,.08); }
.slot-cell.active { background: var(--c-teal); border-color: var(--c-teal); color: #fff; }
.slot-cell.blocked { background: rgba(231,111,81,.12); border-color: var(--c-orange); color: var(--c-orange); cursor: default; }

/* ============================================================
   TABLE
   ============================================================ */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  text-align: left;
  padding: 9px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--c-muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  border-bottom: 1.5px solid var(--c-border);
  white-space: nowrap;
}
.data-table td {
  padding: 10px 12px;
  font-size: 12.5px;
  border-bottom: 1px solid var(--c-bg);
  vertical-align: middle;
}
.data-table tr:hover td { background: rgba(42,157,143,.04); }
.data-table tr:last-child td { border-bottom: none; }

/* ============================================================
   TAGS & BADGES
   ============================================================ */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}
.tag-teal { background: rgba(42,157,143,.15); color: var(--c-teal); }
.tag-navy { background: rgba(26,58,92,.1); color: var(--c-navy); }
.tag-orange { background: rgba(231,111,81,.15); color: var(--c-orange); }
.tag-amber { background: rgba(244,162,97,.2); color: #c07020; }
.tag-error { background: rgba(214,64,69,.12); color: var(--c-error); }
.tag-muted { background: var(--c-bg); color: var(--c-muted); }

/* ============================================================
   ALERTS
   ============================================================ */
.alert {
  display: flex;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--radius);
  font-size: 12.5px;
  border-left: 3px solid transparent;
  margin-bottom: 12px;
}
.alert-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.alert-info { background: rgba(42,157,143,.1); border-color: var(--c-teal); }
.alert-warning { background: rgba(244,162,97,.15); border-color: var(--c-amber); }
.alert-error { background: rgba(214,64,69,.1); border-color: var(--c-error); }
.alert-success { background: rgba(42,157,143,.1); border-color: var(--c-teal); }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,20,40,.5);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(3px);
  animation: fadeIn .15s ease;
}
.modal {
  background: var(--c-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  display: flex; flex-direction: column;
  animation: slideUp .2s ease;
}
.modal-lg { max-width: 800px; }
.modal-xl { max-width: 1000px; }
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--c-border);
  display: flex; align-items: center; gap: 10px;
}
.modal-title { font-size: 15px; font-weight: 600; flex: 1; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--c-border);
  display: flex; gap: 8px; justify-content: flex-end;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ============================================================
   PLANNING GRID
   ============================================================ */
.planning-wrapper {
  overflow-x: auto;
  padding-bottom: 8px;
}

.planning-grid {
  display: grid;
  grid-template-columns: 100px repeat(5, 1fr);
  gap: 3px;
  min-width: 800px;
}

.pg-header-cell {
  background: var(--c-navy);
  color: #fff;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  text-align: center;
}
.pg-header-cell.day-name { font-size: 11px; }
.pg-header-cell.day-name small { display: block; font-size: 10px; font-weight: 400; opacity: .7; }

.pg-time-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--c-slate);
  text-align: center;
  line-height: 1.2;
}

.pg-slot {
  background: var(--c-surface);
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius);
  min-height: 110px;
  padding: 6px;
  position: relative;
  transition: border-color .15s, background .15s;
}
.pg-slot:hover { border-color: var(--c-teal); }
.pg-slot.outing { background: repeating-linear-gradient(45deg, var(--c-bg), var(--c-bg) 4px, #e8eff7 4px, #e8eff7 8px); }
.pg-slot.drag-over { border-color: var(--c-teal); background: rgba(42,157,143,.08); border-style: dashed; }

.pg-slot-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--c-muted);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pg-outing-badge {
  font-size: 10px;
  color: var(--c-amber);
  font-weight: 600;
  text-align: center;
  padding: 6px;
  opacity: .8;
}

/* ---- Group tiles ---- */
.group-tile {
  background: var(--c-bg);
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius);
  margin-bottom: 4px;
  padding: 6px 8px;
  cursor: grab;
  transition: box-shadow .15s, transform .1s;
  position: relative;
}
.group-tile:active { cursor: grabbing; }
.group-tile.dragging { opacity: .5; transform: scale(.97); }
.group-tile-header {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 4px;
}
.group-tile-cat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.group-tile-name { font-size: 11px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-tile-count {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 10px;
  background: var(--c-bg);
  border: 1px solid var(--c-border);
}
.group-tile-count.over { background: rgba(231,111,81,.2); color: var(--c-orange); border-color: var(--c-orange); }
.group-tile-members { display: flex; flex-wrap: wrap; gap: 3px; }
.member-chip {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  cursor: grab;
  transition: all .12s;
  white-space: nowrap;
}
.member-chip:hover { border-color: var(--c-teal); color: var(--c-teal); }
.member-chip.conflict { border-color: var(--c-error); background: rgba(214,64,69,.08); color: var(--c-error); }

/* ---- Séance individuelle (prise en soin 1:1) ---- */
.individual-session-tile {
  background: rgba(244,162,97,.06);
}
.individual-session-tile .group-tile-header {
  gap: 4px;
}

/* ---- Alert panel ---- */
.alerts-panel { display: flex; flex-direction: column; gap: 6px; }

/* ============================================================
   STATS CARDS
   ============================================================ */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-card-value { font-size: 26px; font-weight: 700; color: var(--c-navy); line-height: 1; }
.stat-card-label { font-size: 11.5px; color: var(--c-muted); }
.stat-card-delta { font-size: 11px; font-weight: 500; }
.stat-card.teal .stat-card-value { color: var(--c-teal); }
.stat-card.orange .stat-card-value { color: var(--c-orange); }

/* ============================================================
   PRESCRIPTION EDITOR
   ============================================================ */
.prescription-list { display: flex; flex-direction: column; gap: 8px; }
.prescription-item {
  display: grid;
  grid-template-columns: 1fr 120px 80px auto;
  gap: 8px;
  align-items: center;
  padding: 8px 12px;
  background: var(--c-bg);
  border-radius: var(--radius);
  border: 1px solid var(--c-border);
}

/* ============================================================
   TABS
   ============================================================ */
.tabs { display: flex; gap: 2px; border-bottom: 1.5px solid var(--c-border); margin-bottom: 18px; }
.tab-item {
  padding: 9px 14px;
  font-size: 12.5px;
  cursor: pointer;
  color: var(--c-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1.5px;
  transition: color .15s;
  user-select: none;
}
.tab-item:hover { color: var(--c-text); }
.tab-item.active { color: var(--c-teal); border-color: var(--c-teal); font-weight: 500; }

/* ============================================================
   TOAST NOTIFICATIONS
   ============================================================ */
#toast-container {
  position: fixed;
  bottom: 20px; right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--c-navy);
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 12.5px;
  box-shadow: var(--shadow-lg);
  animation: toastIn .2s ease;
  display: flex;
  gap: 8px;
  align-items: center;
  min-width: 220px;
  max-width: 340px;
  pointer-events: all;
}
.toast.success { background: var(--c-teal); }
.toast.error { background: var(--c-error); }
.toast.warning { background: var(--c-amber); color: var(--c-text); }
.toast.out { animation: toastOut .2s ease forwards; }
@keyframes toastIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateX(20px); opacity: 0; } }

/* ============================================================
   EMPTY STATES
   ============================================================ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  gap: 10px;
  color: var(--c-muted);
  text-align: center;
}
.empty-state-icon { font-size: 40px; opacity: .5; }
.empty-state-title { font-size: 14px; font-weight: 500; color: var(--c-slate); }
.empty-state-desc { font-size: 12px; max-width: 280px; line-height: 1.5; }

/* ============================================================
   UTILS
   ============================================================ */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.ml-auto { margin-left: auto; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mt-4 { margin-top: 16px; }

<script>
// ============================================================
// HDJ PLANNING — Store (localStorage)
// ============================================================

const Store = (() => {
  const KEY = 'hdj_planning_v1';

  const defaultState = () => ({
    units: [
      { id: 'u1', name: 'Unité A', color: '#2A9D8F' },
      { id: 'u2', name: 'Unité B', color: '#E76F51' },
      { id: 'u3', name: 'Unité C', color: '#7B68EE' },
      { id: 'u4', name: 'Unité D', color: '#F4A261' },
    ],
    patients: [],      // PersonSuivie[]
    professionals: [], // Professionnel[]
    mediationCategories: [
      { id: 'arts',    name: 'Arts plastiques', color: '#7B68EE' },
      { id: 'sport',   name: 'Sport / Motricité', color: '#20B2AA' },
      { id: 'music',   name: 'Musique', color: '#FF7F50' },
      { id: 'cuisine', name: 'Cuisine', color: '#DAA520' },
      { id: 'nature',  name: 'Nature / Jardin', color: '#3CB371' },
      { id: 'jeu',     name: 'Jeu / Ludothèque', color: '#FF69B4' },
      { id: 'drama',   name: 'Théâtre / Expression', color: '#CD853F' },
      { id: 'yoga',    name: 'Yoga / Relaxation', color: '#9370DB' },
      { id: 'autre',   name: 'Autre', color: '#708090' },
    ],
    plannings: {}, // unitId → WeekPlanning
    currentUnitId: 'u1',
    settings: {
      currentWeek: getMonday(new Date()).toISOString(),
    }
  });

  function getMonday(d) {
    const dt = new Date(d);
    const day = dt.getDay();
    const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
    dt.setDate(diff);
    dt.setHours(0,0,0,0);
    return dt;
  }

  let state = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? JSON.parse(raw) : defaultState();
    } catch(e) {
      state = defaultState();
    }
    // ensure new fields exist
    if (!state.plannings) state.plannings = {};
    if (!state.settings) state.settings = { currentWeek: getMonday(new Date()).toISOString() };
    return state;
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function get() { return state; }

  function reset() {
    state = defaultState();
    save();
  }

  // ---- Patients ----
  function addPatient(p) {
    p.id = p.id || uid();
    state.patients.push(p);
    save();
    return p;
  }
  function updatePatient(p) {
    const i = state.patients.findIndex(x => x.id === p.id);
    if (i >= 0) { state.patients[i] = p; save(); }
  }
  function deletePatient(id) {
    state.patients = state.patients.filter(p => p.id !== id);
    save();
  }
  function getPatients(unitId) {
    return unitId ? state.patients.filter(p => p.unitId === unitId) : state.patients;
  }

  // ---- Professionals ----
  function addProfessional(p) {
    p.id = p.id || uid();
    state.professionals.push(p);
    save();
    return p;
  }
  function updateProfessional(p) {
    const i = state.professionals.findIndex(x => x.id === p.id);
    if (i >= 0) { state.professionals[i] = p; save(); }
  }
  function deleteProfessional(id) {
    state.professionals = state.professionals.filter(p => p.id !== id);
    save();
  }
  function getProfessionals(unitId) {
    return unitId ? state.professionals.filter(p => p.unitIds && p.unitIds.includes(unitId)) : state.professionals;
  }

  // ---- Planning ----
  function getPlanning(unitId, weekKey) {
    return state.plannings[unitId]?.[weekKey] || null;
  }
  function setPlanning(unitId, weekKey, data) {
    if (!state.plannings[unitId]) state.plannings[unitId] = {};
    state.plannings[unitId][weekKey] = data;
    save();
  }
  function deletePlanning(unitId, weekKey) {
    if (state.plannings[unitId]) {
      delete state.plannings[unitId][weekKey];
      save();
    }
  }

  // ---- Mediation Categories ----
  function getCategories() { return state.mediationCategories; }
  function addCategory(c) {
    c.id = c.id || uid();
    state.mediationCategories.push(c);
    save();
    return c;
  }
  function deleteCategory(id) {
    state.mediationCategories = state.mediationCategories.filter(c => c.id !== id);
    save();
  }

  // ---- Units ----
  function getUnits() { return state.units; }
  function addUnit(u) { u.id = u.id || uid(); state.units.push(u); save(); return u; }
  function updateUnit(u) { const i = state.units.findIndex(x=>x.id===u.id); if(i>=0){state.units[i]=u;save();} }
  function deleteUnit(id) { state.units=state.units.filter(u=>u.id!==id); save(); }

  function setCurrentUnit(id) { state.currentUnitId = id; save(); }
  function setCurrentWeek(iso) { state.settings.currentWeek = iso; save(); }

  // ---- Utils ----
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  return {
    load, save, get, reset, uid, getMonday,
    addPatient, updatePatient, deletePatient, getPatients,
    addProfessional, updateProfessional, deleteProfessional, getProfessionals,
    getPlanning, setPlanning, deletePlanning,
    getCategories, addCategory, deleteCategory,
    getUnits, addUnit, updateUnit, deleteUnit,
    setCurrentUnit, setCurrentWeek,
  };
})();


// ============================================================
// PLANNING ENGINE — Auto-generation
// ============================================================

const PlanningEngine = (() => {

  const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
  const SLOTS = ['matin', 'apresmidi'];
  const SLOT_LABELS = { matin: '09h–12h', apresmidi: '13h–16h' };

  function weekKey(dateISO) {
    return dateISO.slice(0, 10);
  }

  function emptyWeek() {
    const week = {};
    DAYS.forEach((day, di) => {
      week[di] = {};
      SLOTS.forEach(slot => {
        week[di][slot] = {
          isOuting: false,   // sortie extérieure
          groups: [],        // GroupItem[]
        };
      });
    });
    return week;
  }

  /*
   GroupItem = {
     id, name, categoryId, duration (30|45|60),
     professionalIds: [],
     memberIds: [],
   }
   PatientSlot = { patientId, dayIndex, slot }
  */

  // Mapping type de séance individuelle → rôles professionnels compatibles
  const SESSION_TYPE_TO_ROLES = {
    'Orthophonie':        ['Orthophoniste'],
    'Psychomotricité':    ['Psychomotricien(ne)'],
    'Psychologie':        ['Psychologue'],
    'Éducateur spécialisé': ['Éducateur spécialisé', 'Moniteur éducateur'],
    'Infirmier':          ['Infirmier(ère)'],
    'Médecin':            ['Médecin psychiatre'],
    'AES':                ['AES'],
    'Autre':              [],
  };

  function generate(unitId) {
    const state = Store.get();
    const patients = Store.getPatients(unitId);
    const professionals = Store.getProfessionals(unitId);
    const categories = Store.getCategories();

    if (!patients.length) return { week: emptyWeek(), alerts: ['Aucune personne suivie dans cette unité.'] };

    const alerts = [];
    const week = emptyWeek();

    // Sortie fixe : vendredi après-midi
    week[4]['apresmidi'].isOuting = true;

    // ── ÉTAPE 1 : Affectation des créneaux de présence par patient ───────────
    const patientAssignments = {}; // patientId → [{dayIndex, slot}]

    patients.forEach(patient => {
      patientAssignments[patient.id] = [];
      const freqPerWeek = patient.daysPerWeek || 2;
      const preferred = patient.preferredSlots || [];

      let assigned = 0;
      preferred.forEach(ps => {
        if (assigned >= freqPerWeek) return;
        const slotData = week[ps.day]?.[ps.slot];
        if (!slotData || slotData.isOuting) return;
        patientAssignments[patient.id].push({ dayIndex: ps.day, slot: ps.slot });
        assigned++;
      });

      if (assigned < freqPerWeek) {
        const allSlots = [];
        DAYS.forEach((_, di) => {
          SLOTS.forEach(sl => {
            if (!week[di][sl].isOuting) allSlots.push({ dayIndex: di, slot: sl });
          });
        });
        for (let i = allSlots.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [allSlots[i], allSlots[j]] = [allSlots[j], allSlots[i]];
        }
        const usedDays = new Set(patientAssignments[patient.id].map(a => a.dayIndex));
        for (const s of allSlots) {
          if (assigned >= freqPerWeek) break;
          if (usedDays.has(s.dayIndex)) continue;
          patientAssignments[patient.id].push(s);
          usedDays.add(s.dayIndex);
          assigned++;
        }
      }
    });

    // ── ÉTAPE 2 : Groupement optimisé des prescriptions ──────────────────────
    // Suivi de la fréquence planifiée par patient et par catégorie
    const prescScheduled = {}; // patientId → { categoryId → count }
    patients.forEach(p => {
      prescScheduled[p.id] = {};
      (p.prescriptions || []).forEach(pr => { prescScheduled[p.id][pr.categoryId] = 0; });
    });

    // Charge par professionnel (nombre de groupes animés par créneau)
    const proGroupLoad = {}; // proId → { "di_sl" → count }
    professionals.forEach(pro => { proGroupLoad[pro.id] = {}; });

    DAYS.forEach((_, di) => {
      SLOTS.forEach(sl => {
        const slotData = week[di][sl];
        if (slotData.isOuting) return;
        const slotKey = `${di}_${sl}`;

        const presentPatients = patients.filter(p =>
          patientAssignments[p.id]?.some(a => a.dayIndex === di && a.slot === sl)
        );
        if (!presentPatients.length) return;

        // Regroupement par catégorie en respectant la fréquence prescrite
        const catGroups = {}; // categoryId → [{patient, presc}]
        presentPatients.forEach(p => {
          (p.prescriptions || []).forEach(presc => {
            const alreadyDone = prescScheduled[p.id][presc.categoryId] || 0;
            if (alreadyDone >= (presc.frequency || 1)) return;
            if (!catGroups[presc.categoryId]) catGroups[presc.categoryId] = [];
            catGroups[presc.categoryId].push({ patient: p, presc });
          });
        });

        Object.entries(catGroups).forEach(([catId, entries]) => {
          // Filtrage des contre-indications de co-présence
          const cleanEntries = [];
          entries.forEach(({ patient: m, presc }) => {
            const conflict = cleanEntries.some(({ patient: ex }) =>
              (m.contraindications?.coPresence || []).includes(ex.id) ||
              (ex.contraindications?.coPresence || []).includes(m.id)
            );
            if (!conflict) {
              cleanEntries.push({ patient: m, presc });
            } else {
              alerts.push(`⚠️ Conflit de co-présence : ${m.firstName} ${m.lastName} ne peut pas être dans le groupe « ${UI.catName(catId)} » le ${DAYS[di]} ${sl === 'matin' ? 'matin' : 'après-midi'}.`);
            }
          });

          if (!cleanEntries.length) return;

          // Sélection optimale du professionnel :
          // 1) qualifié pour cette catégorie + disponible + moins chargé
          // 2) sinon : simplement disponible
          const slotPros = professionals.filter(pro =>
            (pro.availability || []).some(a => a.day === di && a.slot === sl)
          );
          const qualifiedPros = slotPros
            .filter(pro => (pro.canAnimateCategories || []).includes(catId))
            .sort((a, b) =>
              (proGroupLoad[a.id][slotKey] || 0) - (proGroupLoad[b.id][slotKey] || 0)
            );
          const fallbackPros = slotPros.sort((a, b) =>
            (proGroupLoad[a.id][slotKey] || 0) - (proGroupLoad[b.id][slotKey] || 0)
          );
          const bestPro = qualifiedPros[0] || fallbackPros[0] || null;

          if (!bestPro) {
            const cat = categories.find(c => c.id === catId);
            alerts.push(`⚠️ Aucun professionnel disponible pour la médiation « ${cat?.name || catId} » le ${DAYS[di]} ${sl === 'matin' ? 'matin' : 'après-midi'}.`);
          }

          // Découpage en sous-groupes de 4 maximum
          const chunks = [];
          for (let i = 0; i < cleanEntries.length; i += 4) chunks.push(cleanEntries.slice(i, i + 4));

          const cat = categories.find(c => c.id === catId);
          chunks.forEach((chunk, ci) => {
            const group = {
              id: Store.uid(),
              name: (cat?.name || catId) + (chunks.length > 1 ? ` (${ci + 1})` : ''),
              categoryId: catId,
              duration: chunk[0]?.presc?.duration || 60,
              professionalIds: bestPro ? [bestPro.id] : [],
              memberIds: chunk.map(e => e.patient.id),
              isIndividual: false,
            };

            if (chunk.length > 4) {
              alerts.push(`🔴 Groupe « ${group.name} » dépasse 4 personnes (${chunk.length}) le ${DAYS[di]} ${sl}.`);
            }

            slotData.groups.push(group);

            // Mise à jour des compteurs de fréquence et de charge
            chunk.forEach(({ patient }) => {
              prescScheduled[patient.id][catId] = (prescScheduled[patient.id][catId] || 0) + 1;
            });
            if (bestPro) {
              proGroupLoad[bestPro.id][slotKey] = (proGroupLoad[bestPro.id][slotKey] || 0) + 1;
            }
          });
        });
      });
    });

    // ── ÉTAPE 3 : Planification des prises en soin individuelles ─────────────
    // Suivi des créneaux déjà occupés par professionnel pour séances individuelles
    const proIndivOccupied = {}; // proId → Set<"di_sl">
    professionals.forEach(pro => { proIndivOccupied[pro.id] = new Set(); });

    patients.forEach(patient => {
      (patient.individualSessions || []).forEach(sess => {
        const targetFreq = sess.frequency || 1;
        let scheduled = 0;
        const matchingRoles = SESSION_TYPE_TO_ROLES[sess.type] || [];

        // Créneaux du patient triés (lundi→vendredi, matin avant après-midi)
        const patientSlots = (patientAssignments[patient.id] || [])
          .slice()
          .sort((a, b) => a.dayIndex - b.dayIndex || (a.slot === 'matin' ? -1 : 1));

        for (const { dayIndex: di, slot: sl } of patientSlots) {
          if (scheduled >= targetFreq) break;
          const slotKey = `${di}_${sl}`;
          if (week[di][sl].isOuting) continue;

          // Recherche du professionnel le plus adapté disponible à ce créneau
          const matchingPro = professionals.find(pro => {
            const roleOk = matchingRoles.length === 0 || matchingRoles.includes(pro.role);
            const avail = (pro.availability || []).some(a => a.day === di && a.slot === sl);
            const free = !proIndivOccupied[pro.id].has(slotKey);
            return roleOk && avail && free;
          });

          if (matchingPro) {
            week[di][sl].groups.push({
              id: Store.uid(),
              name: `${sess.type} — ${patient.firstName} ${patient.lastName[0]}.`,
              categoryId: 'individual_session',
              sessionType: sess.type,
              isIndividual: true,
              duration: 60,
              professionalIds: [matchingPro.id],
              memberIds: [patient.id],
              notes: sess.notes || '',
            });
            proIndivOccupied[matchingPro.id].add(slotKey);
            scheduled++;
          }
        }

        if (scheduled < targetFreq) {
          const missing = targetFreq - scheduled;
          const roleStr = matchingRoles.length ? ` (${matchingRoles.join(' ou ')})` : '';
          alerts.push(
            `🔴 Conflit planning — séance « ${sess.type} » pour ${patient.firstName} ${patient.lastName} : ` +
            `${scheduled}/${targetFreq} séance(s) planifiée(s). ` +
            `Aucun professionnel${roleStr} disponible pour ${missing} créneau(x).`
          );
        }
      });
    });

    return { week, alerts, patientAssignments };
  }

  // Validate a single slot after drag-and-drop
  function validateMove(week, patientId, fromDay, fromSlot, toDay, toSlot, patients) {
    const alerts = [];
    const patient = patients.find(p => p.id === patientId);
    if (!patient) return ['Patient introuvable.'];

    if (week[toDay][toSlot].isOuting) {
      alerts.push('❌ Ce créneau est une sortie extérieure — aucune affectation possible.');
    }

    // Check same-day twice
    // Find all other slots where patient appears
    let daysPresent = new Set();
    DAYS.forEach((_, di) => {
      SLOTS.forEach(sl => {
        const slot = week[di][sl];
        slot.groups.forEach(g => {
          if (g.memberIds.includes(patientId)) {
            if (di !== fromDay || sl !== fromSlot) daysPresent.add(di);
          }
        });
      });
    });
    if (daysPresent.has(toDay)) {
      alerts.push(`⚠️ ${patient.firstName} ${patient.lastName} est déjà présent(e) ce jour.`);
    }

    // Check co-presence in target slot
    const targetSlot = week[toDay][toSlot];
    const coPresenceContraindications = patient.contraindications?.coPresence || [];
    targetSlot.groups.forEach(g => {
      g.memberIds.forEach(mid => {
        if (coPresenceContraindications.includes(mid)) {
          const other = patients.find(p => p.id === mid);
          alerts.push(`⚠️ Contre-indication de co-présence avec ${other?.firstName} ${other?.lastName}.`);
        }
      });
    });

    // Max freq per week
    const totalSlots = daysPresent.size + 1;
    const maxFreq = patient.daysPerWeek || 5;
    if (totalSlots > maxFreq) {
      alerts.push(`⚠️ Fréquence de venue dépassée : ${totalSlots}/${maxFreq} demi-journées.`);
    }

    return alerts;
  }

  return { generate, weekKey, emptyWeek, validateMove, DAYS, SLOTS, SLOT_LABELS };
})();


// ============================================================
// CSV IMPORT / EXPORT
// ============================================================

const CSV = (() => {
  function escape(v) {
    const s = String(v ?? '');
    if (s.includes(',') || s.includes('"') || s.includes('\n')) return `"${s.replace(/"/g, '""')}"`;
    return s;
  }

  function toCSV(rows, headers) {
    const lines = [headers.map(escape).join(',')];
    rows.forEach(r => lines.push(headers.map(h => escape(r[h] ?? '')).join(',')));
    return lines.join('\n');
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
      const vals = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQ && line[i+1]==='"') { cur += '"'; i++; } else { inQ = !inQ; } }
        else if (c === ',' && !inQ) { vals.push(cur); cur = ''; }
        else cur += c;
      }
      vals.push(cur);
      const obj = {};
      headers.forEach((h, i) => obj[h] = vals[i] ?? '');
      return obj;
    });
  }

  function download(filename, content) {
    const blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  // Export patients
  function exportPatients(patients) {
    const headers = ['id','firstName','lastName','unitId','daysPerWeek','prescriptions','individualSessions','preferredSlots','contraindications'];
    const rows = patients.map(p => ({
      id: p.id,
      firstName: p.firstName,
      lastName: p.lastName,
      unitId: p.unitId,
      daysPerWeek: p.daysPerWeek,
      prescriptions: JSON.stringify(p.prescriptions || []),
      individualSessions: JSON.stringify(p.individualSessions || []),
      preferredSlots: JSON.stringify(p.preferredSlots || []),
      contraindications: JSON.stringify(p.contraindications || {}),
    }));
    download('patients.csv', toCSV(rows, headers));
  }

  function importPatients(text) {
    const rows = parseCSV(text);
    return rows.map(r => ({
      id: r.id || Store.uid(),
      firstName: r.firstName || '',
      lastName: r.lastName || '',
      unitId: r.unitId || '',
      daysPerWeek: parseInt(r.daysPerWeek) || 2,
      prescriptions: safeJSON(r.prescriptions, []),
      individualSessions: safeJSON(r.individualSessions, []),
      preferredSlots: safeJSON(r.preferredSlots, []),
      contraindications: safeJSON(r.contraindications, {}),
    }));
  }

  function exportProfessionals(pros) {
    const headers = ['id','firstName','lastName','role','unitIds','availability','canAnimateCategories'];
    const rows = pros.map(p => ({
      id: p.id, firstName: p.firstName, lastName: p.lastName, role: p.role,
      unitIds: JSON.stringify(p.unitIds || []),
      availability: JSON.stringify(p.availability || []),
      canAnimateCategories: JSON.stringify(p.canAnimateCategories || []),
    }));
    download('professionnels.csv', toCSV(rows, headers));
  }

  function importProfessionals(text) {
    const rows = parseCSV(text);
    return rows.map(r => ({
      id: r.id || Store.uid(),
      firstName: r.firstName || '',
      lastName: r.lastName || '',
      role: r.role || '',
      unitIds: safeJSON(r.unitIds, []),
      availability: safeJSON(r.availability, []),
      canAnimateCategories: safeJSON(r.canAnimateCategories, []),
    }));
  }

  function exportPlanning(unitId, weekKey, week) {
    const rows = [];
    PlanningEngine.DAYS.forEach((day, di) => {
      PlanningEngine.SLOTS.forEach(sl => {
        const slot = week[di]?.[sl];
        if (!slot) return;
        if (slot.isOuting) {
          rows.push({ unitId, weekKey, day, slot: sl, type: 'sortie', groupId: '', groupName: '', categoryId: '', duration: '', professionalIds: '', memberIds: '' });
        }
        (slot.groups || []).forEach(g => {
          rows.push({
            unitId, weekKey, day, slot: sl, type: 'groupe',
            groupId: g.id, groupName: g.name, categoryId: g.categoryId,
            duration: g.duration, professionalIds: (g.professionalIds||[]).join(';'),
            memberIds: (g.memberIds||[]).join(';'),
          });
        });
      });
    });
    const headers = ['unitId','weekKey','day','slot','type','groupId','groupName','categoryId','duration','professionalIds','memberIds'];
    download(`planning_${unitId}_${weekKey}.csv`, toCSV(rows, headers));
  }

  function safeJSON(s, fallback) {
    try { return JSON.parse(s); } catch { return fallback; }
  }

  return { exportPatients, importPatients, exportProfessionals, importProfessionals, exportPlanning, toCSV, parseCSV, download };
})();

</script>
<script>
// ============================================================
// HDJ PLANNING — UI Components
// ============================================================

const UI = (() => {

  // ---- Toast ----
  function toast(msg, type = 'default', duration = 3000) {
    const container = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const icons = { success: '✅', error: '❌', warning: '⚠️', default: 'ℹ️' };
    t.innerHTML = `<span>${icons[type] || icons.default}</span><span>${msg}</span>`;
    container.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 200); }, duration);
  }

  // ---- Modal ----
  function modal({ title, body, footer, size = '' }) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal ${size}">
        <div class="modal-header">
          <span class="modal-title">${title}</span>
          <button class="btn btn-ghost btn-icon" id="modal-close-btn">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#modal-close-btn').onclick = () => overlay.remove();
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    return overlay;
  }

  // ---- Confirm ----
  function confirm(msg, onConfirm) {
    const overlay = modal({
      title: 'Confirmer',
      body: `<p>${msg}</p>`,
      footer: `<button class="btn btn-outline" id="conf-cancel">Annuler</button>
               <button class="btn btn-danger" id="conf-ok">Confirmer</button>`
    });
    overlay.querySelector('#conf-cancel').onclick = () => overlay.remove();
    overlay.querySelector('#conf-ok').onclick = () => { overlay.remove(); onConfirm(); };
  }

  // ---- Day/Slot matrix ----
  function daySlotMatrix(fieldName, value = []) {
    const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'];
    const slots = [{ key: 'matin', label: 'Matin' }, { key: 'apresmidi', label: 'A-M' }];
    let html = `<div class="day-slot-matrix">
      <div class="header"></div>
      ${days.map(d => `<div class="header">${d}</div>`).join('')}
    `;
    slots.forEach(sl => {
      html += `<div class="row-label">${sl.label}</div>`;
      days.forEach((_, di) => {
        const isActive = value.some(v => v.day === di && v.slot === sl.key);
        html += `<div class="slot-cell ${isActive ? 'active' : ''}" data-day="${di}" data-slot="${sl.key}" data-field="${fieldName}">${isActive ? '✓' : ''}</div>`;
      });
    });
    html += '</div>';
    return html;
  }

  function bindDaySlotMatrix(container, fieldName, onChange) {
    container.querySelectorAll(`.slot-cell[data-field="${fieldName}"]`).forEach(cell => {
      cell.onclick = () => {
        cell.classList.toggle('active');
        cell.textContent = cell.classList.contains('active') ? '✓' : '';
        const selected = [];
        container.querySelectorAll(`.slot-cell[data-field="${fieldName}"].active`).forEach(c => {
          selected.push({ day: parseInt(c.dataset.day), slot: c.dataset.slot });
        });
        onChange(selected);
      };
    });
  }

  // ---- Prescription editor ----
  function prescriptionEditor(prescriptions = [], categories = []) {
    const id = 'presc_' + Date.now();
    return `
      <div id="${id}" class="prescription-list">
        ${prescriptions.map((p, i) => prescriptionRow(p, i, categories, id)).join('')}
      </div>
      <button class="btn btn-outline btn-sm mt-2" onclick="UI.addPrescriptionRow('${id}')">
        + Ajouter une médiation
      </button>`;
  }

  function prescriptionRow(p, i, categories, listId) {
    const cats = Store.getCategories();
    return `
      <div class="prescription-item" data-idx="${i}">
        <select class="form-control" name="presc_cat_${i}">
          <option value="">Catégorie…</option>
          ${cats.map(c => `<option value="${c.id}" ${p.categoryId===c.id?'selected':''}>${c.name}</option>`).join('')}
        </select>
        <select class="form-control" name="presc_freq_${i}">
          ${[1,2,3,4,5].map(n => `<option value="${n}" ${p.frequency==n?'selected':''}>${n}x/sem</option>`).join('')}
        </select>
        <select class="form-control" name="presc_dur_${i}">
          ${[30,45,60].map(n => `<option value="${n}" ${p.duration==n?'selected':''}>${n}min</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-icon btn-sm" onclick="this.closest('.prescription-item').remove()">✕</button>
      </div>`;
  }

  function addPrescriptionRow(listId) {
    const list = document.getElementById(listId);
    const count = list.querySelectorAll('.prescription-item').length;
    const div = document.createElement('div');
    div.innerHTML = prescriptionRow({ categoryId: '', frequency: 1, duration: 60 }, count, [], listId);
    list.appendChild(div.firstElementChild);
  }

  function readPrescriptions(container) {
    const items = [];
    container.querySelectorAll('.prescription-item').forEach((row, i) => {
      const cat = row.querySelector(`[name^="presc_cat"]`)?.value;
      const freq = row.querySelector(`[name^="presc_freq"]`)?.value;
      const dur = row.querySelector(`[name^="presc_dur"]`)?.value;
      if (cat) items.push({ categoryId: cat, frequency: parseInt(freq)||1, duration: parseInt(dur)||60 });
    });
    return items;
  }

  // ---- Individual sessions editor ----
  function sessionEditor(sessions = []) {
    const id = 'sess_' + Date.now();
    const sessionTypes = ['Orthophonie', 'Psychomotricité', 'Psychologie', 'Éducateur spécialisé', 'Infirmier', 'Médecin', 'Autre'];
    return `
      <div id="${id}" class="prescription-list">
        ${sessions.map((s, i) => `
          <div class="prescription-item" data-idx="${i}">
            <select class="form-control" name="sess_type_${i}">
              ${sessionTypes.map(t => `<option ${s.type===t?'selected':''}>${t}</option>`).join('')}
            </select>
            <select class="form-control" name="sess_freq_${i}">
              ${[1,2,3,4,5].map(n => `<option value="${n}" ${s.frequency==n?'selected':''}>${n}x/sem</option>`).join('')}
            </select>
            <input class="form-control" name="sess_notes_${i}" placeholder="Notes…" value="${s.notes||''}" style="font-size:11px">
            <button class="btn btn-ghost btn-icon btn-sm" onclick="this.closest('.prescription-item').remove()">✕</button>
          </div>`).join('')}
      </div>
      <button class="btn btn-outline btn-sm mt-2" onclick="
        const list = document.getElementById('${id}');
        const count = list.querySelectorAll('.prescription-item').length;
        const div = document.createElement('div');
        div.innerHTML = \`<div class='prescription-item'><select class='form-control' name='sess_type_\${count}'><option>Orthophonie</option><option>Psychomotricité</option><option>Psychologie</option><option>Éducateur spécialisé</option><option>Infirmier</option><option>Médecin</option><option>Autre</option></select><select class='form-control' name='sess_freq_\${count}'><option>1x/sem</option><option>2x/sem</option></select><input class='form-control' name='sess_notes_\${count}' placeholder='Notes…'><button class='btn btn-ghost btn-icon btn-sm' onclick='this.closest(&quot;.prescription-item&quot;).remove()'>✕</button></div>\`;
        list.appendChild(div.firstElementChild);
      ">+ Ajouter une prise en soin</button>`;
  }

  function readSessions(container) {
    const items = [];
    container.querySelectorAll('[name^="sess_type"]').forEach((sel, i) => {
      const freq = container.querySelector(`[name="sess_freq_${i}"]`)?.value;
      const notes = container.querySelector(`[name="sess_notes_${i}"]`)?.value;
      items.push({ type: sel.value, frequency: parseInt(freq)||1, notes: notes||'' });
    });
    return items;
  }

  // ---- Color dot ----
  function catDot(categoryId) {
    const cat = Store.getCategories().find(c => c.id === categoryId);
    return `<span class="group-tile-cat-dot" style="background:${cat?.color||'#888'}"></span>`;
  }

  function catName(categoryId) {
    return Store.getCategories().find(c => c.id === categoryId)?.name || categoryId;
  }

  function patientName(patientId) {
    const p = Store.get().patients.find(p => p.id === patientId);
    return p ? `${p.firstName} ${p.lastName}` : patientId;
  }

  function proName(proId) {
    const p = Store.get().professionals.find(p => p.id === proId);
    return p ? `${p.firstName} ${p.lastName}` : proId;
  }

  function unitName(unitId) {
    return Store.getUnits().find(u => u.id === unitId)?.name || unitId;
  }

  return {
    toast, modal, confirm,
    daySlotMatrix, bindDaySlotMatrix,
    prescriptionEditor, addPrescriptionRow, readPrescriptions,
    sessionEditor, readSessions,
    catDot, catName, patientName, proName, unitName,
  };
})();


// ============================================================
// PDF EXPORT (via browser print)
// ============================================================

const PDFExport = (() => {
  function printElement(el, title) {
    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html><html><head>
      <meta charset="utf-8">
      <title>${title}</title>
      <link rel="stylesheet" href="css/style.css">
      <style>
        body { padding: 20px; font-family: Inter, sans-serif; }
        .no-print { display: none !important; }
        .planning-grid { min-width: unset !important; }
        @page { size: A4 landscape; margin: 1cm; }
      </style>
    </head><body>${el.outerHTML}</body></html>`);
    win.document.close();
    win.focus();
    setTimeout(() => { win.print(); win.close(); }, 600);
  }

  function exportPatientSchedule(patientId, week) {
    const patient = Store.get().patients.find(p => p.id === patientId);
    if (!patient) return;

    const lines = [];
    PlanningEngine.DAYS.forEach((day, di) => {
      PlanningEngine.SLOTS.forEach(sl => {
        const slot = week[di]?.[sl];
        if (!slot) return;
        slot.groups.forEach(g => {
          if (g.memberIds.includes(patientId)) {
            const typeLabel = g.isIndividual ? '👤 Séance individuelle' : '👥 Groupe';
            lines.push(`<tr style="${g.isIndividual ? 'background:rgba(244,162,97,.08)' : ''}">
              <td>${day}</td>
              <td>${sl === 'matin' ? 'Matin (09h–12h)' : 'Après-midi (13h–16h)'}</td>
              <td><span style="font-size:10px;opacity:.7">${typeLabel}</span><br>${g.name}</td>
              <td>${g.duration}min</td>
              <td>${g.professionalIds.map(id => UI.proName(id)).join(', ') || '–'}</td>
            </tr>`);
          }
        });
      });
    });

    const html = `<div style="padding:20px">
      <h2 style="color:#1A3A5C;margin-bottom:4px">Planning individuel</h2>
      <h3 style="color:#2A9D8F;margin-bottom:20px">${patient.firstName} ${patient.lastName}</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:#1A3A5C;color:#fff">
          <th style="padding:8px;text-align:left">Jour</th>
          <th style="padding:8px;text-align:left">Créneau</th>
          <th style="padding:8px;text-align:left">Groupe / Activité</th>
          <th style="padding:8px;text-align:left">Durée</th>
          <th style="padding:8px;text-align:left">Professionnels</th>
        </tr></thead>
        <tbody>${lines.join('') || '<tr><td colspan="5" style="padding:12px;color:#888">Aucune activité planifiée.</td></tr>'}</tbody>
      </table>
    </div>`;

    const div = document.createElement('div');
    div.innerHTML = html;
    printElement(div, `Planning — ${patient.firstName} ${patient.lastName}`);
  }

  function exportProSchedule(proId, week) {
    const pro = Store.get().professionals.find(p => p.id === proId);
    if (!pro) return;

    const lines = [];
    PlanningEngine.DAYS.forEach((day, di) => {
      PlanningEngine.SLOTS.forEach(sl => {
        const slot = week[di]?.[sl];
        if (!slot) return;
        slot.groups.forEach(g => {
          if (g.professionalIds.includes(proId)) {
            const typeLabel = g.isIndividual ? '👤 Séance individuelle' : '👥 Groupe';
            lines.push(`<tr style="${g.isIndividual ? 'background:rgba(244,162,97,.08)' : ''}">
              <td>${day}</td>
              <td>${sl === 'matin' ? 'Matin (09h–12h)' : 'Après-midi (13h–16h)'}</td>
              <td><span style="font-size:10px;opacity:.7">${typeLabel}</span><br>${g.name}</td>
              <td>${g.isIndividual ? '1 pers. (1:1)' : `${g.memberIds.length} pers.`}</td>
              <td>${g.duration}min</td>
            </tr>`);
          }
        });
      });
    });

    const html = `<div style="padding:20px">
      <h2 style="color:#1A3A5C;margin-bottom:4px">Planning professionnel</h2>
      <h3 style="color:#2A9D8F;margin-bottom:20px">${pro.firstName} ${pro.lastName} — ${pro.role}</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:#1A3A5C;color:#fff">
          <th style="padding:8px;text-align:left">Jour</th><th style="padding:8px;text-align:left">Créneau</th>
          <th style="padding:8px;text-align:left">Groupe</th><th style="padding:8px;text-align:left">Membres</th>
          <th style="padding:8px;text-align:left">Durée</th>
        </tr></thead>
        <tbody>${lines.join('') || '<tr><td colspan="5" style="padding:12px;color:#888">Aucune activité.</td></tr>'}</tbody>
      </table>
    </div>`;

    const div = document.createElement('div');
    div.innerHTML = html;
    printElement(div, `Planning — ${pro.firstName} ${pro.lastName}`);
  }

  function exportUnitSchedule(unitId, week) {
    const unitName = UI.unitName(unitId);
    const gridEl = document.getElementById('planning-grid-container');
    if (gridEl) printElement(gridEl, `Planning ${unitName}`);
  }

  return { exportPatientSchedule, exportProSchedule, exportUnitSchedule };
})();

          <div id="slot-matrix-container">${slotMatrix}</div>
        </div>
      </div>

      <div id="tab-prescriptions" class="hidden">
        <div class="form-group">
          <label class="form-label">Médiations prescrites</label>
          <div class="form-hint mb-2">Catégories de médiations à intégrer dans le planning</div>
          <div id="presc-container">${prescHTML}</div>
        </div>
        <div class="divider"></div>
        <div class="form-group">
          <label class="form-label">Prises en soin individuelles</label>
          <div class="form-hint mb-2">Séances spécialisées hors groupes à médiation</div>
          <div id="sess-container">${sessHTML}</div>
        </div>
      </div>

      <div id="tab-contraindications" class="hidden">
        <div class="form-group">
          <label class="form-label">Contre-indications d'activités</label>
          <textarea class="form-control" id="p-ci-activities" placeholder="Ex: Pas d'activités sportives intenses, éviter la piscine…">${p?.contraindications?.activities||''}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Incompatibilités de co-présence</label>
          <div class="form-hint mb-2">Personnes ne devant pas se retrouver dans le même groupe</div>
          <div class="checkbox-group" id="copresence-list">
            ${Store.getPatients().filter(x => x.id !== id).map(op => `
              <label class="checkbox-item ${(p?.contraindications?.coPresence||[]).includes(op.id)?'checked':''}">
                <input type="checkbox" value="${op.id}" ${(p?.contraindications?.coPresence||[]).includes(op.id)?'checked':''}>
                ${op.firstName} ${op.lastName} <span class="text-xs text-muted">(${UI.unitName(op.unitId)})</span>
              </label>`).join('')}
            ${Store.getPatients().filter(x => x.id !== id).length === 0 ? '<span class="text-muted text-sm">Aucune autre personne suivie enregistrée.</span>' : ''}
          </div>
        </div>
      </div>`;

    const footer = `
      <button class="btn btn-outline" onclick="document.querySelector('.modal-overlay').remove()">Annuler</button>
      <button class="btn btn-teal" onclick="PagePatients.save('${id||''}')">💾 Enregistrer</button>`;

    const overlay = UI.modal({ title: id ? '✏️ Modifier la personne suivie' : '+ Nouvelle personne suivie', body, footer, size: 'modal-lg' });

    // Bind slot matrix
    let preferredSlots = p?.preferredSlots || [];
    UI.bindDaySlotMatrix(overlay, 'preferred_slots', (vals) => { preferredSlots = vals; });
    overlay._preferredSlots = () => preferredSlots;

    // Bind checkbox styles
    overlay.querySelectorAll('#copresence-list .checkbox-item input').forEach(cb => {
      cb.onchange = () => cb.closest('.checkbox-item').classList.toggle('checked', cb.checked);
    });
  },

  save(id) {
    const overlay = document.querySelector('.modal-overlay');
    const fname = document.getElementById('p-fname')?.value.trim();
    const lname = document.getElementById('p-lname')?.value.trim();
    if (!fname || !lname) { UI.toast('Prénom et nom requis', 'error'); return; }

    const prescriptions = UI.readPrescriptions(document.getElementById('presc-container'));
    const individualSessions = UI.readSessions(document.getElementById('sess-container'));
    const preferredSlots = overlay?._preferredSlots?.() || [];

    const coPresence = [];
    document.querySelectorAll('#copresence-list input:checked').forEach(cb => coPresence.push(cb.value));

    const data = {
      id: id || undefined,
      firstName: fname,
      lastName: lname,
      unitId: document.getElementById('p-unit')?.value,
      daysPerWeek: parseInt(document.getElementById('p-freq')?.value) || 2,
      prescriptions,
      individualSessions,
      preferredSlots,
      contraindications: {
        activities: document.getElementById('p-ci-activities')?.value || '',
        coPresence,
      }
    };

    if (id) {
      data.id = id;
      Store.updatePatient(data);
      UI.toast('Personne suivie mise à jour', 'success');
    } else {
      Store.addPatient(data);
      UI.toast('Personne suivie ajoutée', 'success');
    }

    overlay.remove();
    App.navigate('patients');
  },

  delete(id) {
    const p = Store.get().patients.find(x => x.id === id);
    UI.confirm(`Supprimer ${p?.firstName} ${p?.lastName} ?`, () => {
      Store.deletePatient(id);
      UI.toast('Supprimé', 'success');
      App.navigate('patients');
    });
  },

  importCSV() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.csv';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const patients = CSV.importPatients(ev.target.result);
        patients.forEach(p => Store.addPatient(p));
        UI.toast(`${patients.length} personne(s) importée(s)`, 'success');
        App.navigate('patients');
      };
      reader.readAsText(file);
    };
    input.click();
  }
};

function switchTab(el, targetId) {
  el.closest('.tabs').querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const parent = el.closest('.modal-body') || document.getElementById('page-content');
  ['tab-identity','tab-prescriptions','tab-contraindications','tab-general','tab-availability'].forEach(id => {
    const el2 = parent.querySelector(`#${id}`);
    if (el2) el2.classList.toggle('hidden', id !== targetId);
  });
}

const PagePlanning = {
  _dragPatientId: null,
  _dragFromDay: null,
  _dragFromSlot: null,
  _dragGroupId: null,

    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekISO = state.settings.currentWeek;

    weekEnd.setDate(weekEnd.getDate() + 4);
