          <button class="btn btn-outline" onclick="PDFExport.exportUnitSchedule('${unitId}',PagePlanning._currentWeek)">🖨 Imprimer</button>
        </div>
      </div>

      ${planning?.alerts?.length ? `
        <div class="alert alert-warning mb-3">
          <span class="alert-icon">⚠️</span>
          <div>
            <strong>${planning.alerts.length} alerte(s) de planification</strong>
            <div id="alert-detail" class="hidden mt-2">${(planning.alerts||[]).map(a=>`<div style="margin-bottom:4px">${a}</div>`).join('')}</div>
            <button class="btn btn-ghost btn-sm mt-1" onclick="
              const d=document.getElementById('alert-detail');
              d.classList.toggle('hidden');
              this.textContent=d.classList.contains('hidden')?'Voir les alertes':'Masquer';
            ">Voir les alertes</button>
          </div>
        </div>` : ''}

      <div id="planning-grid-container">
        ${planning?.week ? this.renderGrid(planning.week) : this.renderEmpty()}
      </div>

      <div class="mt-4">
        <div class="card">
          <div class="card-header">
            <span class="card-title">🔑 Légende</span>
          </div>
          <div class="card-body" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
            ${Store.getCategories().map(c => `
              <div style="display:flex;align-items:center;gap:6px">
                <span style="width:12px;height:12px;border-radius:50%;background:${c.color};display:inline-block;flex-shrink:0"></span>
                <span style="font-size:12px">${c.name}</span>
              </div>`).join('')}
            <div style="display:flex;align-items:center;gap:6px;border-left:2px solid var(--c-border);padding-left:10px;margin-left:4px">
              <span style="width:3px;height:16px;background:var(--c-amber);border-radius:2px;display:inline-block;flex-shrink:0"></span>
              <span style="font-size:12px;font-weight:600;color:var(--c-amber)">👤 Séance individuelle (1:1)</span>
            </div>
          </div>
        </div>
      </div>`;
  },

  renderEmpty() {
    return `<div class="card">
      <div class="empty-state">
        <div class="empty-state-icon">📅</div>
        <div class="empty-state-title">Aucun planning pour cette semaine</div>
        <div class="empty-state-desc">Cliquez sur "Générer automatiquement" pour créer le planning, ou construisez-le manuellement.</div>
        <button class="btn btn-teal mt-3" onclick="PagePlanning.generate()">⚡ Générer le planning</button>
      </div>
    </div>`;
  },

  renderGrid(week) {
    const days = PlanningEngine.DAYS;
    const slots = PlanningEngine.SLOTS;
    const slotLabels = PlanningEngine.SLOT_LABELS;

    let html = `<div class="planning-wrapper"><div class="planning-grid">
      <div class="pg-header-cell"></div>
      ${days.map((d, di) => {
        const weekStart = new Date(Store.get().settings.currentWeek);
        const dayDate = new Date(weekStart);
        dayDate.setDate(dayDate.getDate() + di);
        return `<div class="pg-header-cell day-name">${d}<small>${dayDate.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</small></div>`;
      }).join('')}
    `;

    slots.forEach(sl => {
      html += `<div class="pg-time-cell">${slotLabels[sl]}<br><span style="font-size:9px;color:var(--c-muted)">${sl==='matin'?'Matin':'A-midi'}</span></div>`;

      days.forEach((_, di) => {
        const slotData = week[di]?.[sl] || { isOuting: false, groups: [] };
        const isOuting = slotData.isOuting;

        html += `<div class="pg-slot ${isOuting?'outing':''}"
          data-day="${di}" data-slot="${sl}"
          ondragover="PagePlanning.onDragOver(event)"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="PagePlanning.onDrop(event,${di},'${sl}')">`;

        html += `<div class="pg-slot-label">
          <span>${(() => {
            const groups = (slotData.groups||[]);
            const medCount = groups.filter(g => !g.isIndividual).length;
            const indivCount = groups.filter(g => g.isIndividual).length;
            const parts = [];
            if (medCount) parts.push(`${medCount} groupe${medCount>1?'s':''}`);
            if (indivCount) parts.push(`${indivCount} séance${indivCount>1?'s':''} ind.`);
            return parts.join(' · ') || '–';
          })()}</span>
          <button class="btn btn-ghost btn-icon" style="padding:2px;font-size:11px" 
            onclick="PagePlanning.addGroup(${di},'${sl}')"
            title="Ajouter un groupe">＋</button>
        </div>`;

        if (isOuting) {
          html += `<div class="pg-outing-badge">🚌 Sortie extérieure</div>`;
        } else {
          (slotData.groups || []).forEach(g => {
            html += this.renderGroupTile(g, di, sl);
          });
        }

        html += '</div>';
      });
    });

    html += '</div></div>';
    return html;
  },

  renderGroupTile(group, dayIndex, slot) {
    // ── Séance individuelle (prise en soin 1:1) ──
    if (group.isIndividual) {
      const patient = Store.get().patients.find(x => x.id === group.memberIds?.[0]);
      const noPro = !group.professionalIds?.length;
      return `
        <div class="group-tile individual-session-tile" style="border-left:3px solid var(--c-amber)"
          draggable="true"
          ondragstart="PagePlanning.onGroupDragStart(event,'${group.id}',${dayIndex},'${slot}')">
          <div class="group-tile-header">
            <span style="font-size:11px;flex-shrink:0">👤</span>
            <span class="group-tile-name" title="${group.name}" style="flex:1">${group.name}</span>
            <span style="font-size:9px;background:rgba(244,162,97,.25);color:var(--c-amber);padding:1px 5px;border-radius:4px;font-weight:700;flex-shrink:0">1:1</span>
            <button class="btn btn-ghost btn-icon" style="padding:1px;font-size:10px;margin-left:2px"
              onclick="PagePlanning.editGroup('${group.id}',${dayIndex},'${slot}')">✏️</button>
            <button class="btn btn-ghost btn-icon" style="padding:1px;font-size:10px"
              onclick="PagePlanning.deleteGroup('${group.id}',${dayIndex},'${slot}')">✕</button>
          </div>
          ${group.notes ? `<div style="font-size:9px;color:var(--c-muted);margin-top:2px;font-style:italic">${group.notes}</div>` : ''}
          <div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:2px">
            ${noPro
              ? `<span class="tag" style="font-size:9px;padding:1px 5px;background:rgba(214,64,69,.1);color:var(--c-error)">⚠️ Aucun pro assigné</span>`
              : group.professionalIds.map(pid => `<span class="tag tag-navy" style="font-size:9px;padding:1px 5px">${UI.proName(pid)}</span>`).join('')
            }
          </div>
        </div>`;
    }

    // ── Groupe de médiation (prescription) ──
    const cat = Store.getCategories().find(c => c.id === group.categoryId);
    const color = cat?.color || '#888';
    const count = group.memberIds?.length || 0;
    const over = count > 4;

    return `
      <div class="group-tile" style="border-left:3px solid ${color}"
        draggable="true"
        ondragstart="PagePlanning.onGroupDragStart(event,'${group.id}',${dayIndex},'${slot}')">
        <div class="group-tile-header">
          <span class="group-tile-cat-dot" style="background:${color}"></span>
          <span class="group-tile-name" title="${group.name}">${group.name}</span>
          <span class="group-tile-count ${over?'over':''}">${count}/4</span>
          <button class="btn btn-ghost btn-icon" style="padding:1px;font-size:10px;margin-left:2px"
            onclick="PagePlanning.editGroup('${group.id}',${dayIndex},'${slot}')">✏️</button>
          <button class="btn btn-ghost btn-icon" style="padding:1px;font-size:10px"
            onclick="PagePlanning.deleteGroup('${group.id}',${dayIndex},'${slot}')">✕</button>
        </div>
        <div class="group-tile-members">
          ${(group.memberIds||[]).map(mid => {
            const p = Store.get().patients.find(x => x.id === mid);
            return `<span class="member-chip"
              draggable="true"
              ondragstart="PagePlanning.onMemberDragStart(event,'${mid}','${group.id}',${dayIndex},'${slot}')"
              title="${p?.firstName||''} ${p?.lastName||''}">${p?.firstName?.[0]||'?'}${p?.lastName?.[0]||'?'}</span>`;
          }).join('')}
          ${group.memberIds?.length===0?`<span class="text-xs text-muted">Vide</span>`:''}
        </div>
        ${group.professionalIds?.length ? `
          <div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:2px">
            ${group.professionalIds.map(pid => `<span class="tag tag-navy" style="font-size:9px;padding:1px 5px">${UI.proName(pid)}</span>`).join('')}
          </div>` : ''}
        ${over ? `<div class="alert alert-error" style="margin-top:4px;padding:3px 6px;font-size:10px">🔴 Dépasse 4 personnes</div>` : ''}
      </div>`;
  },

  generate() {
    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    const patients = Store.getPatients(unitId);

    if (!patients.length) {
      UI.toast('Aucune personne suivie dans cette unité', 'warning');
      return;
    }

    const result = PlanningEngine.generate(unitId);
    Store.setPlanning(unitId, weekKey, { week: result.week, alerts: result.alerts, patientAssignments: result.patientAssignments });

    if (result.alerts.length) {
      UI.toast(`Planning généré avec ${result.alerts.length} alerte(s)`, 'warning');
    } else {
      UI.toast('Planning généré avec succès', 'success');
    }
    App.navigate('planning');
  },

  prevWeek() {
    const cur = new Date(Store.get().settings.currentWeek);
    cur.setDate(cur.getDate() - 7);
    Store.setCurrentWeek(cur.toISOString());
    App.navigate('planning');
  },

  nextWeek() {
    const cur = new Date(Store.get().settings.currentWeek);
    cur.setDate(cur.getDate() + 7);
    Store.setCurrentWeek(cur.toISOString());
    App.navigate('planning');
  },

  exportCSV() {
    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    const planning = Store.getPlanning(unitId, weekKey);
    if (!planning?.week) { UI.toast('Aucun planning à exporter', 'warning'); return; }
    CSV.exportPlanning(unitId, weekKey, planning.week);
  },

  // ---- Drag & Drop ----
  onGroupDragStart(e, groupId, dayIndex, slot) {
    this._dragGroupId = groupId;
    this._dragFromDay = dayIndex;
    this._dragFromSlot = slot;
    e.dataTransfer.effectAllowed = 'move';
  },

  onMemberDragStart(e, patientId, groupId, dayIndex, slot) {
    this._dragPatientId = patientId;
    this._dragGroupId = groupId;
    this._dragFromDay = dayIndex;
    this._dragFromSlot = slot;
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  },

  onDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
  },

  onDrop(e, toDay, toSlot) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');

    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    const planning = Store.getPlanning(unitId, weekKey);
    if (!planning?.week) return;

    const week = planning.week;

    if (this._dragPatientId) {
      // Moving individual member
      const pid = this._dragPatientId;
      const fromDay = this._dragFromDay;
      const fromSlot = this._dragFromSlot;
      const fromGroupId = this._dragGroupId;

      const alerts = PlanningEngine.validateMove(week, pid, fromDay, fromSlot, toDay, toSlot, Store.get().patients);
      if (alerts.length) {
        const overlay = UI.modal({
          title: '⚠️ Alertes de déplacement',
          body: `<div class="alerts-panel">${alerts.map(a => `<div class="alert alert-warning"><span class="alert-icon">⚠️</span><span>${a}</span></div>`).join('')}</div>
                 <p class="text-sm mt-2">Souhaitez-vous quand même déplacer cette personne ?</p>`,
          footer: `<button class="btn btn-outline" onclick="document.querySelector('.modal-overlay').remove()">Annuler</button>
                   <button class="btn btn-danger" onclick="PagePlanning._forceMove('${pid}','${fromGroupId}',${fromDay},'${fromSlot}',${toDay},'${toSlot}')">Déplacer quand même</button>`
        });
      } else {
        this._forceMove(pid, fromGroupId, fromDay, fromSlot, toDay, toSlot);
      }
    } else if (this._dragGroupId) {
      // Moving whole group
      const fromDay = parseInt(this._dragFromDay);
      const fromSlot = this._dragFromSlot;
      const fromGid = this._dragGroupId;

      const fromSlotData = week[fromDay][fromSlot];
      const groupIdx = fromSlotData.groups.findIndex(g => g.id === fromGid);
      if (groupIdx < 0) return;

      const group = fromSlotData.groups.splice(groupIdx, 1)[0];

      if (!week[toDay][toSlot].groups) week[toDay][toSlot].groups = [];
      if (!week[toDay][toSlot].isOuting) {
        week[toDay][toSlot].groups.push(group);
        Store.setPlanning(unitId, weekKey, { ...planning, week });
        UI.toast('Groupe déplacé', 'success');
        App.navigate('planning');
      } else {
        // Put back
        fromSlotData.groups.splice(groupIdx, 0, group);
        UI.toast('Impossible : créneau de sortie', 'error');
      }
    }

    this._dragPatientId = null;
    this._dragGroupId = null;
  },

  _forceMove(patientId, fromGroupId, fromDay, fromSlot, toDay, toSlot) {
    document.querySelector('.modal-overlay')?.remove();
    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    const planning = Store.getPlanning(unitId, weekKey);
    if (!planning?.week) return;

    const week = planning.week;

    // Remove from source group
    const fromSlotData = week[parseInt(fromDay)][fromSlot];
    const srcGroup = fromSlotData.groups.find(g => g.id === fromGroupId);
    if (srcGroup) srcGroup.memberIds = srcGroup.memberIds.filter(id => id !== patientId);

    // Add to target slot (first group of same category, or create new)
    const toSlotData = week[parseInt(toDay)][toSlot];
    let targetGroup = toSlotData.groups[0];
    if (!targetGroup) {
      targetGroup = { id: Store.uid(), name: 'Groupe', categoryId: '', duration: 60, professionalIds: [], memberIds: [] };
      toSlotData.groups.push(targetGroup);
    }
    if (!targetGroup.memberIds.includes(patientId)) targetGroup.memberIds.push(patientId);

    Store.setPlanning(unitId, weekKey, { ...planning, week });
    UI.toast('Personne déplacée', 'success');
    App.navigate('planning');
  },

  addGroup(dayIndex, slot) {
    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    let planning = Store.getPlanning(unitId, weekKey);
    if (!planning) {
      const week = PlanningEngine.emptyWeek();
      planning = { week, alerts: [] };
    }
    const cats = Store.getCategories();
    const patients = Store.getPatients(unitId);
    const pros = Store.getProfessionals(unitId);

    const body = `
      <div class="form-row cols-2">
        <div class="form-group">
          <label class="form-label">Nom du groupe</label>
          <input class="form-control" id="ng-name" placeholder="Ex: Arts plastiques 1">
        </div>
        <div class="form-group">
          <label class="form-label">Catégorie de médiation</label>
          <select class="form-control" id="ng-cat">
            <option value="">–</option>
            ${cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Durée</label>
        <select class="form-control" id="ng-dur">
          <option value="30">30 minutes</option>
          <option value="45">45 minutes</option>
          <option value="60" selected>1 heure</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Membres (max 4)</label>
        <div class="checkbox-group" id="ng-members">
          ${patients.map(p => `
            <label class="checkbox-item">
              <input type="checkbox" value="${p.id}">
              ${p.firstName} ${p.lastName}
            </label>`).join('')}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Professionnels animateurs</label>
        <div class="checkbox-group" id="ng-pros">
          ${pros.map(p => `
            <label class="checkbox-item">
              <input type="checkbox" value="${p.id}">
              ${p.firstName} ${p.lastName} (${p.role})
            </label>`).join('')}
        </div>
      </div>`;

    const footer = `
      <button class="btn btn-outline" onclick="document.querySelector('.modal-overlay').remove()">Annuler</button>
      <button class="btn btn-teal" onclick="PagePlanning._saveNewGroup(${dayIndex},'${slot}')">Créer le groupe</button>`;

    const overlay = UI.modal({ title: '+ Nouveau groupe', body, footer });
    overlay.querySelectorAll('.checkbox-item input').forEach(cb => {
      cb.onchange = () => cb.closest('.checkbox-item').classList.toggle('checked', cb.checked);
    });
  },

  _saveNewGroup(dayIndex, slot) {
    const name = document.getElementById('ng-name')?.value.trim();
    const catId = document.getElementById('ng-cat')?.value;
    const duration = parseInt(document.getElementById('ng-dur')?.value) || 60;
    const memberIds = [], proIds = [];
    document.querySelectorAll('#ng-members input:checked').forEach(cb => memberIds.push(cb.value));
    document.querySelectorAll('#ng-pros input:checked').forEach(cb => proIds.push(cb.value));

    if (!name) { UI.toast('Nom du groupe requis', 'error'); return; }

    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    let planning = Store.getPlanning(unitId, weekKey) || { week: PlanningEngine.emptyWeek(), alerts: [] };

    const group = { id: Store.uid(), name, categoryId: catId, duration, professionalIds: proIds, memberIds };
    planning.week[dayIndex][slot].groups.push(group);

    if (memberIds.length > 4) {
      planning.alerts = planning.alerts || [];
      planning.alerts.push(`⚠️ Groupe "${name}" dépasse 4 personnes.`);
    }

    Store.setPlanning(unitId, weekKey, planning);
    document.querySelector('.modal-overlay')?.remove();
    UI.toast('Groupe créé', 'success');
    App.navigate('planning');
  },

  editGroup(groupId, dayIndex, slot) {
    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    const planning = Store.getPlanning(unitId, weekKey);
    if (!planning) return;
    const group = planning.week[dayIndex][slot].groups.find(g => g.id === groupId);
    if (!group) return;

    const cats = Store.getCategories();
    const patients = Store.getPatients(unitId);
    const pros = Store.getProfessionals(unitId);

    const body = `
      <div class="form-row cols-2">
        <div class="form-group">
          <label class="form-label">Nom du groupe</label>
          <input class="form-control" id="eg-name" value="${group.name}">
        </div>
        <div class="form-group">
          <label class="form-label">Catégorie</label>
          <select class="form-control" id="eg-cat">
            <option value="">–</option>
            ${cats.map(c => `<option value="${c.id}" ${group.categoryId===c.id?'selected':''}>${c.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Durée</label>
        <select class="form-control" id="eg-dur">
          ${[30,45,60].map(n => `<option value="${n}" ${group.duration==n?'selected':''}>${n} min</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Membres</label>
        <div class="checkbox-group" id="eg-members">
          ${patients.map(p => `
            <label class="checkbox-item ${group.memberIds.includes(p.id)?'checked':''}">
              <input type="checkbox" value="${p.id}" ${group.memberIds.includes(p.id)?'checked':''}>
              ${p.firstName} ${p.lastName}
            </label>`).join('')}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Professionnels animateurs</label>
        <div class="checkbox-group" id="eg-pros">
          ${pros.map(p => `
            <label class="checkbox-item ${group.professionalIds.includes(p.id)?'checked':''}">
              <input type="checkbox" value="${p.id}" ${group.professionalIds.includes(p.id)?'checked':''}>
              ${p.firstName} ${p.lastName} (${p.role})
            </label>`).join('')}
        </div>
      </div>`;

    const footer = `
      <button class="btn btn-outline" onclick="document.querySelector('.modal-overlay').remove()">Annuler</button>
      <button class="btn btn-teal" onclick="PagePlanning._saveEditGroup('${groupId}',${dayIndex},'${slot}')">💾 Enregistrer</button>`;

    const overlay = UI.modal({ title: '✏️ Modifier le groupe', body, footer });
    overlay.querySelectorAll('.checkbox-item input').forEach(cb => {
      cb.onchange = () => cb.closest('.checkbox-item').classList.toggle('checked', cb.checked);
    });
  },

  _saveEditGroup(groupId, dayIndex, slot) {
    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    const planning = Store.getPlanning(unitId, weekKey);
    if (!planning) return;

    const group = planning.week[dayIndex][slot].groups.find(g => g.id === groupId);
    if (!group) return;

    group.name = document.getElementById('eg-name')?.value.trim() || group.name;
    group.categoryId = document.getElementById('eg-cat')?.value || '';
    group.duration = parseInt(document.getElementById('eg-dur')?.value) || 60;
    group.memberIds = [];
    group.professionalIds = [];
    document.querySelectorAll('#eg-members input:checked').forEach(cb => group.memberIds.push(cb.value));
    document.querySelectorAll('#eg-pros input:checked').forEach(cb => group.professionalIds.push(cb.value));

    Store.setPlanning(unitId, weekKey, planning);
    document.querySelector('.modal-overlay')?.remove();
    UI.toast('Groupe mis à jour', 'success');
    App.navigate('planning');
  },

  deleteGroup(groupId, dayIndex, slot) {
    UI.confirm('Supprimer ce groupe ?', () => {
      const state = Store.get();
      const unitId = state.currentUnitId;
      const weekKey = state.settings.currentWeek?.slice(0, 10);
      const planning = Store.getPlanning(unitId, weekKey);
      if (!planning) return;
      planning.week[dayIndex][slot].groups = planning.week[dayIndex][slot].groups.filter(g => g.id !== groupId);
      Store.setPlanning(unitId, weekKey, planning);
      UI.toast('Groupe supprimé', 'success');
      App.navigate('planning');
    });
  }
};


// ---- INDIVIDUAL PLANNINGS ----
const PageIndividual = {
  render() {
    const state = Store.get();
    const unitId = state.currentUnitId;
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    const planning = Store.getPlanning(unitId, weekKey);

    const patients = Store.getPatients(unitId);
    const pros = Store.getProfessionals(unitId);

    return `
      <div class="tabs">
        <div class="tab-item active" onclick="PageIndividual.switchView(this,'persons')">Personnes suivies</div>
        <div class="tab-item" onclick="PageIndividual.switchView(this,'pros')">Professionnels</div>
      </div>

      <div id="view-persons">
        ${patients.length === 0 ? `<div class="empty-state"><div class="empty-state-icon">👤</div><div class="empty-state-title">Aucune personne suivie</div></div>` :
          `<div class="form-row" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
            ${patients.map(p => this.patientCard(p, planning?.week)).join('')}
          </div>`}
      </div>

      <div id="view-pros" class="hidden">
        ${pros.length === 0 ? `<div class="empty-state"><div class="empty-state-icon">🩺</div><div class="empty-state-title">Aucun professionnel</div></div>` :
          `<div class="form-row" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
            ${pros.map(p => this.proCard(p, planning?.week)).join('')}
          </div>`}
      </div>`;
  },

  patientCard(patient, week) {
    const slots = [];
    if (week) {
      PlanningEngine.DAYS.forEach((day, di) => {
        PlanningEngine.SLOTS.forEach(sl => {
          const slotData = week[di]?.[sl];
          (slotData?.groups || []).forEach(g => {
            if (g.memberIds.includes(patient.id)) {
              slots.push(`<div style="display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--c-bg)">
                <span style="font-size:11px;color:var(--c-slate);width:60px">${day}</span>
                <span style="font-size:10px;color:var(--c-muted);width:35px">${sl==='matin'?'Matin':'A-M'}</span>
                <span class="tag tag-teal" style="font-size:10px">${g.name}</span>
              </div>`);
            }
          });
        });
      });
    }

    return `<div class="card">
      <div class="card-header">
        <span class="card-title">${patient.firstName} ${patient.lastName}</span>
        <button class="btn btn-outline btn-sm ml-auto" 
          onclick="PDFExport.exportPatientSchedule('${patient.id}',Store.getPlanning('${Store.get().currentUnitId}','${Store.get().settings.currentWeek?.slice(0,10)}')?.week||{})">
          🖨 PDF
        </button>
      </div>
      <div class="card-body" style="padding:12px">
        <div style="font-size:11px;color:var(--c-muted);margin-bottom:6px">${patient.daysPerWeek||2}j/sem · ${UI.unitName(patient.unitId)}</div>
        ${slots.length ? slots.join('') : '<span class="text-xs text-muted">Aucune activité planifiée cette semaine.</span>'}
      </div>
    </div>`;
  },

  proCard(pro, week) {
    const slots = [];
    if (week) {
      PlanningEngine.DAYS.forEach((day, di) => {
        PlanningEngine.SLOTS.forEach(sl => {
          const slotData = week[di]?.[sl];
          (slotData?.groups || []).forEach(g => {
            if (g.professionalIds.includes(pro.id)) {
              slots.push(`<div style="display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--c-bg)">
                <span style="font-size:11px;color:var(--c-slate);width:60px">${day}</span>
                <span style="font-size:10px;color:var(--c-muted);width:35px">${sl==='matin'?'Matin':'A-M'}</span>
                <span class="tag tag-navy" style="font-size:10px">${g.name}</span>
                <span class="tag tag-muted" style="font-size:10px">${g.memberIds.length}p</span>
              </div>`);
            }
          });
        });
      });
    }

    return `<div class="card">
      <div class="card-header">
        <span class="card-title">${pro.firstName} ${pro.lastName}</span>
        <button class="btn btn-outline btn-sm ml-auto"
          onclick="PDFExport.exportProSchedule('${pro.id}',Store.getPlanning('${Store.get().currentUnitId}','${Store.get().settings.currentWeek?.slice(0,10)}')?.week||{})">
          🖨 PDF
        </button>
      </div>
      <div class="card-body" style="padding:12px">
        <div style="font-size:11px;color:var(--c-muted);margin-bottom:6px">${pro.role||'–'}</div>
        ${slots.length ? slots.join('') : '<span class="text-xs text-muted">Aucune activité planifiée cette semaine.</span>'}
      </div>
    </div>`;
  },

  switchView(el, view) {
    el.closest('.tabs').querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('view-persons').classList.toggle('hidden', view !== 'persons');
    document.getElementById('view-pros').classList.toggle('hidden', view !== 'pros');
  }
};

  },

  addUnit() {

      title: '+ Nouvelle unité',
      body: `<div class="form-group"><label class="form-label">Nom</label><input class="form-control" id="unit-name" placeholder="Unité X"></div>
             <div class="form-group"><label class="form-label">Couleur</label><input type="color" id="unit-color" value="#2A9D8F" style="width:60px;height:36px;border:none;border-radius:6px;cursor:pointer"></div>`,
      footer: `<button class="btn btn-outline" onclick="document.querySelector('.modal-overlay').remove()">Annuler</button>
               <button class="btn btn-teal" onclick="PageSettings._saveUnit()">Créer</button>`
    });
  },

  _saveUnit() {
    const name = document.getElementById('unit-name')?.value.trim();
    const color = document.getElementById('unit-color')?.value;
    if (!name) { UI.toast('Nom requis', 'error'); return; }
    Store.addUnit({ name, color });
    document.querySelector('.modal-overlay')?.remove();
    UI.toast('Unité créée', 'success');
    App.navigate('settings');
  },

  renameUnit(id, currentName) {
    const overlay = UI.modal({
      title: 'Renommer l\'unité',
      body: `<div class="form-group"><label class="form-label">Nom</label><input class="form-control" id="unit-rename" value="${currentName}"></div>`,
      footer: `<button class="btn btn-outline" onclick="document.querySelector('.modal-overlay').remove()">Annuler</button>
               <button class="btn btn-teal" onclick="
                 const name=document.getElementById('unit-rename').value.trim();
                 if(!name){return;}
                 Store.updateUnit({id:'${id}',name,color:Store.getUnits().find(u=>u.id==='${id}')?.color||'#888'});
                 document.querySelector('.modal-overlay').remove();
                 UI.toast('Renommé','success');
                 App.navigate('settings');
               ">Enregistrer</button>`
    });
  },

  updateUnitColor(id, color) {
    const unit = Store.getUnits().find(u => u.id === id);
    if (unit) { unit.color = color; Store.updateUnit(unit); }
  },

  deleteUnit(id) {
    UI.confirm('Supprimer cette unité ? Les données associées ne seront pas supprimées.', () => {
      Store.deleteUnit(id);
      UI.toast('Unité supprimée', 'success');
      App.navigate('settings');
    });
  },

  addCategory() {
    const overlay = UI.modal({
      title: '+ Nouvelle catégorie de médiation',
      body: `<div class="form-group"><label class="form-label">Nom</label><input class="form-control" id="cat-name" placeholder="Ex: Danse thérapie"></div>
             <div class="form-group"><label class="form-label">Couleur</label><input type="color" id="cat-color" value="#7B68EE" style="width:60px;height:36px;border:none;border-radius:6px;cursor:pointer"></div>`,
      footer: `<button class="btn btn-outline" onclick="document.querySelector('.modal-overlay').remove()">Annuler</button>
               <button class="btn btn-teal" onclick="
                 const name=document.getElementById('cat-name').value.trim();
                 const color=document.getElementById('cat-color').value;
                 if(!name){UI.toast('Nom requis','error');return;}
                 Store.addCategory({name,color});
                 document.querySelector('.modal-overlay').remove();
                 UI.toast('Catégorie créée','success');
                 App.navigate('settings');
               ">Créer</button>`
    });
  },

  updateCatColor(id, color) {
    const cats = Store.getCategories();
    const cat = cats.find(c => c.id === id);
    if (cat) { cat.color = color; Store.save(); }
  },

  deleteCategory(id) {
    UI.confirm('Supprimer cette catégorie ?', () => {
      Store.deleteCategory(id);
      UI.toast('Catégorie supprimée', 'success');
      App.navigate('settings');
    });
  },

  importPatients() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.csv';
    input.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const patients = CSV.importPatients(ev.target.result);
        patients.forEach(p => Store.addPatient(p));
        UI.toast(`${patients.length} importé(s)`, 'success');
        App.navigate('settings');
      };
      reader.readAsText(file);
    };
    input.click();
  },

  importProfessionals() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.csv';
    input.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const pros = CSV.importProfessionals(ev.target.result);
        pros.forEach(p => Store.addProfessional(p));
        UI.toast(`${pros.length} importé(s)`, 'success');
        App.navigate('settings');
      };
      reader.readAsText(file);
    };
    input.click();
  },

  exportAll() {
    const data = JSON.stringify(Store.get(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hdj_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
    URL.revokeObjectURL(url);
  },

  importAll() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        UI.confirm('Cela remplacera TOUTES les données actuelles. Continuer ?', () => {
          try {
            const data = JSON.parse(ev.target.result);
            localStorage.setItem('hdj_planning_v1', JSON.stringify(data));
            Store.load();
            UI.toast('Données restaurées', 'success');
            App.navigate('dashboard');
          } catch { UI.toast('Fichier invalide', 'error'); }
        });
      };
      reader.readAsText(file);
    };
    input.click();
  },

  resetAll() {
    UI.confirm('⚠️ Cette action supprime TOUTES les données. Cette opération est irréversible.', () => {
      Store.reset();
      UI.toast('Données réinitialisées', 'success');
      App.navigate('dashboard');
    });
  }
};

</script>
<script>
// ============================================================
// HDJ PLANNING — Application principale
// ============================================================

const App = (() => {
  const routes = {
    dashboard:     { title: 'Tableau de bord', page: PageDashboard },
    patients:      { title: 'Personnes suivies', page: PagePatients },
    professionals: { title: 'Professionnels', page: PageProfessionals },
    planning:      { title: 'Planning hebdomadaire', page: PagePlanning },
    individual:    { title: 'Plannings individuels', page: PageIndividual },
    settings:      { title: 'Paramètres', page: PageSettings },
  };

  let currentRoute = 'dashboard';

  function navigate(route) {
    currentRoute = route;
    render();
  }

  function render() {
    const state = Store.get();
    const route = routes[currentRoute];
    const unit = Store.getUnits().find(u => u.id === state.currentUnitId);

    // Update nav active state
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.route === currentRoute);
    });

    // Update topbar
    document.getElementById('topbar-title').textContent = route.title;
    document.getElementById('topbar-subtitle').textContent = unit ? `${unit.name} · ${new Date(state.settings.currentWeek).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}` : '';

    // Update unit selector
    const sel = document.getElementById('sidebar-unit-select');
    if (sel) sel.value = state.currentUnitId;

    // Update alert badge
    const weekKey = state.settings.currentWeek?.slice(0, 10);
    const planning = Store.getPlanning(state.currentUnitId, weekKey);
    const alertCount = planning?.alerts?.length || 0;
    const badge = document.getElementById('alert-badge');
    if (badge) { badge.textContent = alertCount; badge.style.display = alertCount > 0 ? '' : 'none'; }

    // Render page content
    document.getElementById('page-content').innerHTML = route.page.render();
  }

  function buildSidebar() {
    const units = Store.getUnits();
    const state = Store.get();

    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = `
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🏥</div>
        <div>
          <div class="sidebar-logo-text">HDJ Planning</div>
          <div class="sidebar-logo-sub">Hôpital de Jour</div>
        </div>
      </div>

      <div class="sidebar-unit-selector">
        <label>Unité active</label>
        <select id="sidebar-unit-select" onchange="App.changeUnit(this.value)">
          ${units.map(u => `<option value="${u.id}" ${state.currentUnitId===u.id?'selected':''}>${u.name}</option>`).join('')}
        </select>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Navigation</div>

        <div class="nav-item" data-route="dashboard" onclick="App.navigate('dashboard')">
          <span class="nav-icon">📊</span> Tableau de bord
        </div>
        <div class="nav-item" data-route="patients" onclick="App.navigate('patients')">
          <span class="nav-icon">👤</span> Personnes suivies
        </div>
        <div class="nav-item" data-route="professionals" onclick="App.navigate('professionals')">
          <span class="nav-icon">🩺</span> Professionnels
        </div>

        <div class="nav-section-label" style="margin-top:8px">Planning</div>

        <div class="nav-item" data-route="planning" onclick="App.navigate('planning')">
          <span class="nav-icon">📅</span> Planning hebdomadaire
          <span class="nav-badge" id="alert-badge" style="display:none">0</span>
        </div>
        <div class="nav-item" data-route="individual" onclick="App.navigate('individual')">
          <span class="nav-icon">📋</span> Plannings individuels
        </div>

        <div class="nav-section-label" style="margin-top:8px">Configuration</div>

        <div class="nav-item" data-route="settings" onclick="App.navigate('settings')">
          <span class="nav-icon">⚙️</span> Paramètres
        </div>
      </nav>

      <div class="sidebar-footer">
        HDJ Planning v1.0 · 100% local<br>
        <span style="font-size:9px;opacity:.6">Aucune donnée transmise</span>
      </div>
    `;
  }

  function changeUnit(unitId) {
    Store.setCurrentUnit(unitId);
    render();
  }

  function init() {
    Store.load();
    buildSidebar();
    render();
  }

  return { navigate, render, changeUnit, init };
})();

// Boot
document.addEventListener('DOMContentLoaded', () => App.init());

</script>

</body>
</html>
